[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwnforge"
version = "1.0.0"
description = "Self-hosted cybersecurity training and virtual lab platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "SQLAlchemy==2.0.36",
  "alembic==1.14.0",
  "python-multipart==0.0.20",
  "argon2-cffi==23.1.0",
  "itsdangerous==2.2.0",
  "PyYAML==6.0.2",
  "psutil==6.1.1",
  "websockets==14.1",
  "typer==0.15.1",
  "click==8.1.8",
  "rich==13.9.4",
  "jsonschema==4.23.0",
  "httpx==0.28.1",
  "cryptography==44.0.0",
  "pycdlib==1.14.0",
]

[project.scripts]
pwnforge = "backend.app.cli:app"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["backend.tests*"]
