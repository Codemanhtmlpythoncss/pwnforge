- id: web-security-lab
  title: Web Security Lab
  description: A vulnerable web application, a database and a monitoring host on an isolated network.
    Assess the app, verify findings and apply fixes.
  difficulty: intermediate
  category: web-security
  machines:
  - role: attacker
    profile_id: web-chain-nginx-php-a
    network: lab
  - role: web
    profile_id: input-validation-nginx-php-i
    network: lab
  - role: db
    profile_id: db-hardening-postgres-i
    network: lab
  - role: monitor
    profile_id: log-investigation-debian-monitor-i
    network: lab
  networks:
  - name: lab
    mode: isolated
  startup_order:
  - db
  - web
  - monitor
  - attacker
