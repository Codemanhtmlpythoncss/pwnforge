- id: foothold-weak-ssh
  title: 'Foothold: Weak SSH Password'
  description: A black-box target. You are given only its IP address — no credentials. The machine runs
    a remote-access service that was left with a weak password. Discover the service, gain access, and
    read the flag from the account's home directory.
  difficulty: easy
  category: initial-access
  machines:
  - role: target
    profile_id: linux-enum-ssh-linux-e
    network: lab
    target:
      user: amy
      password: sunshine
  networks:
  - name: lab
    mode: isolated
  startup_order:
  - target
  readiness_checks: []
  course_id: null
  estimated_minutes: 45
  reset_behavior: disposable
  objectives:
  - Discover the open service on the target
  - Gain access by finding the weak credential
  - Read and submit the flag
  tags:
  - initial-access
  - ssh
  - brute-force
  - black-box
  tasks: []
  hints:
  - title: What's exposed?
    text: You only have an IP. Start with a port scan (e.g. nmap). What service is listening, and what
      does it let you do remotely?
  - title: A way in
    text: The service accepts password logins and the password left on it is weak. You'll need a username
      — common first names are a good guess — and a common-password wordlist.
  - title: Guess the password
    text: Use a login-guessing tool (such as hydra or ncrack) against the service with a common-password
      list and likely usernames. Once you're in, the flag is a file in the user's home directory (try
      `ls` and `cat flag.txt`).
  guide: 'Walkthrough — Foothold: Weak SSH Password


    1. Enumerate: `nmap -sV <target-ip>` shows TCP 22 (OpenSSH) open.

    2. The box has a user with a weak password. The account is `amy` (a common first name — you could
    also brute a small username list). The password, `sunshine`, is near the top of common wordlists such
    as rockyou.txt.

    3. Guess it: `hydra -l amy -P /usr/share/wordlists/rockyou.txt ssh://<target-ip>` (or simply try common
    passwords by hand). It recovers `amy:sunshine` quickly.

    4. Log in: `ssh amy@<target-ip>`, then `cat ~/flag.txt` and submit the value.


    Why it exists: password authentication plus a weak, guessable password is one of the most common ways
    real systems are compromised.

    How to prevent it: disable SSH password auth in favour of keys, enforce strong passwords, and add
    rate-limiting/lockout (e.g. fail2ban) so guessing is impractical.'
- id: foothold-default-creds
  title: 'Foothold: Default Credentials'
  description: A black-box target that was deployed and never had its default administrator credentials
    changed. Find the service, log in with the credentials it shipped with, and read the flag.
  difficulty: beginner
  category: initial-access
  machines:
  - role: target
    profile_id: service-config-ssh-linux-e
    network: lab
    target:
      user: admin
      password: admin
      sudo: true
  networks:
  - name: lab
    mode: isolated
  startup_order:
  - target
  readiness_checks: []
  course_id: null
  estimated_minutes: 30
  reset_behavior: disposable
  objectives:
  - Find the exposed service
  - Log in with default credentials
  - Read and submit the flag
  tags:
  - initial-access
  - default-credentials
  - black-box
  tasks: []
  hints:
  - title: Find the service
    text: Scan the target. A remote-login service is exposed.
  - title: Think defaults
    text: Appliances and quick deployments often keep the credentials they ship with. The most common
      administrator username and password pair is worth trying first.
  - title: Log in
    text: Try admin / admin (and other common default pairs) over SSH. Once in, the flag is in the home
      directory — `cat flag.txt`.
  guide: 'Walkthrough — Foothold: Default Credentials


    1. `nmap -sV <target-ip>` → TCP 22 open (OpenSSH).

    2. The box was left with its default admin login: `admin:admin`.

    3. `ssh admin@<target-ip>` with password `admin`, then `cat ~/flag.txt`.


    Why: unchanged default credentials are a leading cause of real breaches.

    Prevent: force a credential change on first boot, and never ship guessable defaults.'
- id: foothold-enumerate-user
  title: 'Foothold: Name the User'
  description: A black-box target with a weak password — but you'll have to work out the username first.
    Enumerate the box, identify a valid account, then recover its weak password and read the flag.
  difficulty: intermediate
  category: initial-access
  machines:
  - role: target
    profile_id: linux-enum-ssh-linux-e
    network: lab
    target:
      user: mwilson
      password: liverpool
  networks:
  - name: lab
    mode: isolated
  startup_order:
  - target
  readiness_checks: []
  course_id: null
  estimated_minutes: 60
  reset_behavior: disposable
  objectives:
  - Enumerate the target and identify a valid username
  - Recover the weak password
  - Read and submit the flag
  tags:
  - initial-access
  - enumeration
  - brute-force
  - black-box
  tasks: []
  hints:
  - title: Service first
    text: As always, scan first. SSH is open — but you need a username before a password guess is any
      use.
  - title: Usernames
    text: Real accounts often follow a pattern (first initial + surname is common). A small username wordlist
      of likely names, tried against SSH, will reveal which ones exist.
  - title: Then the password
    text: With a valid username, run a password guess against SSH with a common wordlist (football clubs
      and the like are common weak passwords). Then `cat ~/flag.txt`.
  guide: 'Walkthrough — Foothold: Name the User


    1. `nmap -sV <target-ip>` → SSH on 22.

    2. Usernames follow first-initial+surname: the valid account is `mwilson`. A username wordlist (e.g.
    hydra with `-L names.txt`) confirms which accounts exist.

    3. Guess the password with a wordlist: it''s `liverpool` (a common weak password). `hydra -l mwilson
    -P rockyou.txt ssh://<target-ip>`.

    4. `ssh mwilson@<target-ip>`, `cat ~/flag.txt`.


    Prevent: don''t use guessable usernames as a security layer; enforce strong passwords and key auth.'
- id: lab-linux-smb-enumeration
  title: Linux and SMB Service Inventory
  description: Inspect a small Linux host, identify its active services, and record the evidence you used.
    This is a disposable, isolated VM. Complete the service inventory and course check, then capture the
    instance flag.
  difficulty: easy
  category: linux
  machines:
  - role: target
    profile_id: linux-enum-smb-linux-e
    network: lab
  networks:
  - name: lab
    mode: isolated
  startup_order:
  - target
  readiness_checks: []
  course_id: linux-fundamentals
  estimated_minutes: 40
  reset_behavior: disposable
  objectives:
  - Inspect a small Linux host, identify its active services, and record the evidence you used.
  - Identify configured services and verify listening sockets with command output.
  - Complete the graded worksheet and capture the lab flag.
  tags:
  - linux
  - enum
  - easy
  - debian
  - learning-path
  - guided
  tasks:
  - id: service-inventory
    kind: service_list
    prompt: Identify the service name(s) configured for this target's application/profile and enter them,
      separated by commas. Use `systemctl` (or `rc-service -l` on Alpine), then cross-check any network
      listeners with `ss -lntup`. Extra base OS services are okay.
    answer:
    - smbd
    hint: Start with the service manager, then compare service names with the process and port information
      from `ss -lntup`.
    explanation: A service inventory should name each configured service and be supported by evidence
      from service status or listening sockets.
  - id: course-check
    kind: short_answer
    prompt: Which command lists listening sockets together with process names on Linux?
    answers: &id002
    - ss -lntup
    - ss -tulpen
    - ss -tunlp
    hint: Use the modern socket-statistics utility and request listening TCP/UDP sockets plus process
      details.
    explanation: '`ss` reports socket state; `-lntup` selects listening sockets and includes numeric ports
      and process information.'
  hints:
  - title: Start with the host
    text: Use the lab's own terminal and inspect the target assigned to this disposable workspace.
  - title: Inventory services
    text: On Debian/Ubuntu try `systemctl list-units --type=service --state=running`; on Alpine try `rc-service
      -l`. Compare with `ss -lntup`.
  - title: Verify before you submit
    text: Separate service names from port numbers, and use the command output as evidence rather than
      guessing from the lab title.
  guide: ''
