  - Choose scanners, HTTP clients, proxies, and packet tools for a stated question
  - Keep every probe within a written target and rate scope
  - Interpret output and validate important results with a second observation
  - Protect credentials and preserve relevant command and response evidence
  - Explain tool limitations and produce a reproducible result
  capstone:
    title: Scoped multi-tool assessment
    scenario: Use a small approved range to answer a service and application question with complementary
      tools.
    success_criteria:
    - State target scope and use bounded options
    - Identify services using both remote and host-side evidence where available
    - Correlate tool output and explain discrepancies
    - Save reproducible evidence without exposing secrets
- id: path-osint
  title: OSINT & Reconnaissance
  description: Define a lawful collection question, gather public-source information, corroborate it,
    assess confidence, protect operational security, and write a careful report. Labs require source and
    time notes so claims remain auditable.
  specialization: osint
  difficulty_min: easy
  difficulty_max: advanced
  tags:
  - osint
  - recon
  steps:
  - order: 1
    course_id: osint-fundamentals
    lab_id: null
    required: true
    note: ''
  - order: 2
    course_id: null
    lab_id: lab-osint-source-confidence
    required: true
    note: Record provenance and confidence
  - order: 3
    course_id: reconnaissance
    lab_id: null
    required: true
    note: ''
  - order: 4
    course_id: null
    lab_id: lab-osint-recon-tooling
    required: true
    note: Choose a bounded collection method
  - order: 5
    course_id: null
    lab_id: network-basics-lab
    required: false
    note: 'Hands-on recon: enumerate a target network'
  - order: 6
    course_id: osint-techniques
    lab_id: null
    required: true
    note: ''
  - order: 7
    course_id: null
    lab_id: lab-osint-corroboration
    required: true
    note: Corroborate independent observations
  - order: 8
    course_id: osint-tools
    lab_id: null
    required: true
    note: ''
  - order: 9
    course_id: null
    lab_id: lab-osint-api-gateway-footprint
    required: true
    note: Analyse a bounded simulated footprint
  - order: 10
    course_id: osint-opsec-reporting
    lab_id: null
    required: true
    note: ''
  - order: 11
    course_id: null
    lab_id: lab-osint-opsec-review
    required: true
    note: Plan ethical collection and reporting
  - order: 12
    course_id: null
    lab_id: osint-investigation-lab
    required: true
    note: OSINT investigation challenge
  outcomes:
  - Define a lawful collection question, subject, timeframe, and data limits
  - Record source provenance, collection time, and the exact claim supported
  - Corroborate important claims with independent sources and check contradictions
  - Assign confidence and distinguish fact from inference
  - Write a privacy-aware report that explains source and collection limitations
  capstone:
    title: Auditable public-source investigation
    scenario: Investigate a bounded fictional subject, corroborate a claim, and produce a source-linked
      report.
    success_criteria:
    - Record source URL, collection time, and relevant evidence for each claim
    - Use independent corroboration and note contradictory information
    - Explain confidence and separate inference from fact
    - Minimise personal data and document the lawful scope
