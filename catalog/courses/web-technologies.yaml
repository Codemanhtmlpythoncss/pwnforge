    prompt: Which cookie flag limits cross-site sending?
    choices:
    - Secure
    - HttpOnly
    - SameSite
    - Path
    answer: SameSite
    competency: session-management
    explanation: SameSite controls cross-site cookie sending.
    points: 10
    hints: []
  - kind: short_answer
    prompt: scheme+host+port defines an ___
    answer: origin
    competency: web-technologies
    explanation: That triple is the origin.
    points: 10
    hints: []
  difficulty: beginner
  passing_score: 70
  description: ''
