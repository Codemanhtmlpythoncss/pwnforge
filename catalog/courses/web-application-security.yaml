id: web-application-security
title: Web Application Security
description: The common classes of web vulnerability and how to prevent them.
difficulty: intermediate
category: web-security
specialization: web
estimated_minutes: 95
objectives:
- Understand trust boundaries and input
- Understand the owasp top 10 mindset
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- http-https
competency_prereqs:
- http-fundamentals
tags:
- web
references: []
os_requirements: []
lab_id: web-security-lab
version: 1.0.0
lessons:
- title: Trust boundaries and input
  difficulty: intermediate
  minutes: 20
  competency: input-validation
  body: 'Most web vulnerabilities come from mixing untrusted input with a trusted context. The defensive
    mental model: identify every trust boundary (user → app, app → database, app → OS, app → browser)
    and ensure data is validated on input and correctly encoded for each output context. This single idea
    underlies SQLi, XSS, command injection and more.'
  exercises:
  - kind: mcq
    prompt: 'The root cause of injection flaws is:'
    choices:
    - Slow servers
    - Mixing untrusted data with a trusted context
    - Too many headers
    - Weak CPUs
    answer: Mixing untrusted data with a trusted context
    competency: input-validation
    explanation: Injection arises when data crosses into a command/markup context.
    points: 10
    hints: []
  hints:
  - text: Validate on input, encode on output — for the specific context.
  walkthrough: []
- title: The OWASP Top 10 mindset
  difficulty: intermediate
  minutes: 15
  competency: vuln-assessment
  body: 'The OWASP Top 10 catalogues prevalent risks: broken access control, cryptographic failures, injection,
    insecure design, misconfiguration, and more. Treat it as a checklist for review, not a guarantee.
    For each category, learn the defensive control: parameterised queries, output encoding, strong authz
    checks, secure defaults.'
  exercises:
  - kind: short_answer
    prompt: OWASP risk category for missing authorisation checks? (broken ___ control)
    answer: access
    competency: access-control
    explanation: Broken access control.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Trace a browser request through the application
  difficulty: intermediate
  minutes: 20
  competency: input-validation
  body: 'Follow an input from the request into application logic, storage, and the response. Identify
    the trust boundary at each step. Authentication answers who the user is; authorization decides what
    that user may do. For output, note whether data enters HTML text, an attribute, JavaScript, or a URL,
    because each context needs the correct encoding. For database operations, parameterize values rather
    than joining user text into query strings.


    Use the methods from **Web Application Security** to work this checklist:


    - Understand trust boundaries and input

    - Understand the owasp top 10 mindset


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What should be used for values in a database query?
    choices:
    - Parameterized queries
    - String concatenation
    - A hidden form field
    - Client-side validation alone
    answer: Parameterized queries
    competency: input-validation
    explanation: Parameterized queries keep user-controlled values separate from SQL syntax.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Verify fixes at the right context
  difficulty: intermediate
  minutes: 20
  competency: input-validation
  body: 'Use a harmless test value in an authorised environment and record the request, response, and
    affected account. Change one control, then repeat the same request and confirm the unsafe result is
    gone. Also verify normal input still succeeds and access checks apply to direct API requests, not
    only hidden or disabled buttons. Document the exact affected route and the evidence supporting the
    result.


    ## Apply this to Web Application Security


    The common classes of web vulnerability and how to prevent them.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: input-validation
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Web Application Security Assessment
  questions:
  - kind: mcq
    prompt: Best defence against injection generally?
    choices:
    - Disable logs
    - Context-correct encoding and parameterisation
    - Hide errors
    - Use GET only
    answer: Context-correct encoding and parameterisation
    competency: input-validation
    explanation: Separate data from code via parameterisation/encoding.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Encode output for the ___ it enters (context).
    answer: context
    competency: input-validation
    explanation: Encode per output context.
    points: 10
    hints: []
  difficulty: intermediate
  passing_score: 70
  description: ''
