lessons:
- title: Profiles/symbols & core plugins
  difficulty: advanced
  minutes: 20
  competency: tool-forensics-tooling
  body: 'Volatility analyses RAM captures.


    ```

    vol -f mem.raw windows.pslist          # processes

    vol -f mem.raw windows.netscan         # network connections

    vol -f mem.raw windows.pstree          # process tree

    vol -f mem.raw windows.cmdline         # command lines

    ```

    (Volatility 3 auto-detects symbols.) Memory reveals what disk can''t — running processes, injected
    code, and network state at capture time.'
  exercises:
  - kind: short_answer
    prompt: Volatility plugin to list processes (windows.ps___)?
    answer: pslist
    competency: tool-forensics-tooling
    explanation: windows.pslist.
    points: 10
    hints: []
  hints:
  - text: Compare pslist vs pstree to spot odd parent/child relationships.
  walkthrough: []
