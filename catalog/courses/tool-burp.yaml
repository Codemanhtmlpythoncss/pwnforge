id: tool-burp
title: 'Burp Suite: Web Proxy Testing'
description: Intercept, inspect, replay and tamper HTTP for authorised web testing.
difficulty: intermediate
category: tools
specialization: web
estimated_minutes: 115
objectives:
- Understand proxy & intercept
- Understand repeater & decoder
- Understand intruder & scanner (responsibly)
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- web-application-security
- http-https
competency_prereqs: []
tags:
- tool
- hands-on
references: []
os_requirements: []
lab_id: web-security-lab
version: 1.0.0
lessons:
- title: Proxy & intercept
  difficulty: intermediate
  minutes: 20
  competency: tool-web-proxy
  body: 'Burp sits between your browser and the app so you can see and modify every request. Set the browser
    proxy to `127.0.0.1:8080`, install Burp''s CA cert for HTTPS, then use **Proxy → Intercept** to pause
    and edit requests. **HTTP history** records everything for review. Point it only at your lab app.


    > Only run these tools against systems you own or are explicitly authorised to test — the Pwnforge
    labs are built for exactly this. Unauthorised scanning or access is unethical and usually unlawful.'
  exercises:
  - kind: mcq
    prompt: 'Burp''s default proxy listener is:'
    choices:
    - 0.0.0.0:80
    - 127.0.0.1:8080
    - 127.0.0.1:443
    - 10.0.0.1:8000
    answer: 127.0.0.1:8080
    competency: tool-web-proxy
    explanation: Default is 127.0.0.1:8080.
    points: 10
    hints: []
  hints:
  - text: Install Burp's CA cert so HTTPS traffic is readable.
  walkthrough: []
- title: Repeater & Decoder
  difficulty: intermediate
  minutes: 20
  competency: tool-web-proxy
  body: '**Repeater** lets you resend and tweak a single request repeatedly — ideal for probing how a
    parameter changes a response (the manual way to confirm injection/authz issues). **Decoder** encodes/decodes
    URL/base64/hex. **Comparer** diffs two responses. Working manually in Repeater teaches you *why* a
    bug exists, not just that a scanner flagged it.'
  exercises:
  - kind: short_answer
    prompt: Burp tab for resending/tweaking one request?
    answer: Repeater
    competency: tool-web-proxy
    explanation: Repeater.
    points: 10
    hints: []
  hints: []
  walkthrough:
  - title: Start the Web Security Lab
    detail: Owned, intentional target.
  - title: Proxy the browser
    detail: Point it at 127.0.0.1:8080, trust the CA.
  - title: Send to Repeater
    detail: Right-click a request → Send to Repeater.
  - title: Vary one input
    detail: Change a parameter, compare responses.
- title: Intruder & scanner (responsibly)
  difficulty: intermediate
  minutes: 15
  competency: tool-web-proxy
  body: '**Intruder** automates sending many payloads to a position (e.g. to test input handling); use
    small, targeted sets against your lab, not blind floods. The **Scanner** (Pro) crawls and flags issues
    — treat results as leads. Always keep scope tight so you never touch anything out of bounds.'
  exercises:
  - kind: mcq
    prompt: 'Scanner/Intruder results are:'
    choices:
    - Confirmed vulns
    - Leads to verify
    - Exploits
    - Patches
    answer: Leads to verify
    competency: tool-web-proxy
    explanation: Verify everything manually.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Choose a tool for a specific question
  difficulty: intermediate
  minutes: 20
  competency: tool-web-proxy
  body: 'State the question you need answered before choosing a scanner, proxy, packet analyser, or password
    auditor. Confirm the target and limits, select the smallest useful option set, and save the complete
    output with tool version and timestamp. Understand what the tool measures and what it cannot see;
    a result may be incomplete because of filtering, authentication, or protocol behaviour.


    Use the methods from **Burp Suite: Web Proxy Testing** to work this checklist:


    - Understand proxy & intercept

    - Understand repeater & decoder

    - Understand intruder & scanner (responsibly)


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What should you do with a security tool's important result?
    choices:
    - Validate it with evidence
    - Assume it is always correct
    - Ignore its scope
    - Publish it without review
    answer: Validate it with evidence
    competency: tool-web-proxy
    explanation: Tools are aids to analysis; validate important output and preserve enough context to
      reproduce it.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Validate tool output and preserve context
  difficulty: intermediate
  minutes: 20
  competency: tool-web-proxy
  body: 'Verify important results with a second method or direct observation. For a finding, include the
    command or request, relevant output, target, and time. Avoid broad or high-rate options when a narrow
    check answers the question. Keep credentials and tokens out of saved transcripts, and stop if the
    tool behaves outside the authorised scope.


    ## Apply this to Burp Suite: Web Proxy Testing


    Intercept, inspect, replay and tamper HTTP for authorised web testing.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: tool-web-proxy
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
