references: []
os_requirements: []
lab_id: null
version: 1.0.0
lessons:
- title: Writing a useful report
  difficulty: intermediate
  minutes: 20
  competency: security-reporting
  body: 'A report serves the reader who must act. Each finding needs: a clear title, risk rating (impact
    × likelihood), affected assets, reproduction steps, evidence, and specific remediation. Lead with
    an executive summary; keep technical detail precise and reproducible. Ethics and scope discipline
    underpin the profession.'
  exercises:
  - kind: mcq
    prompt: 'A finding''s rating combines impact and:'
    choices:
    - Length
    - Likelihood
    - Font
    - Author
    answer: Likelihood
    competency: security-reporting
    explanation: Impact × likelihood.
    points: 10
    hints: []
  hints:
  - text: Write for the person who must fix it.
  walkthrough: []
- title: Follow an evidence-led assessment workflow
  difficulty: intermediate
  minutes: 20
  competency: security-reporting
  body: 'Begin with written authorisation, scope, exclusions, timing, and stop conditions. Discover only
    what the scope permits. For each possible issue, keep the raw observation, the affected asset, the
    method, and the timestamp. Validate impact with the least intrusive safe check that answers the question;
    do not turn a scanner warning into a confirmed vulnerability without evidence.


    Use the methods from **Security Reporting and Professional Practice** to work this checklist:


    - Understand writing a useful report


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What must be agreed before active testing begins?
    choices:
    - Written authorisation and scope
    - A public IP address
    - A scanner version
    - A vulnerability score
    answer: Written authorisation and scope
    competency: security-reporting
    explanation: Active tests must stay within explicit authorisation, scope, and stop conditions.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Prioritise and communicate findings
  difficulty: intermediate
  minutes: 20
  competency: security-reporting
  body: 'A useful finding names the affected asset and condition, explains realistic impact, and gives
    reproducible evidence. Rate severity using a stated method and explain assumptions. Recommend a fix
    that addresses the root cause, then define a retest that would demonstrate success. State limitations
    and out-of-scope observations separately so readers can distinguish confirmed results from leads.


    ## Apply this to Security Reporting and Professional Practice


    Communicate findings clearly, ethically and actionably.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: security-reporting
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Security Reporting and Professional Practice Assessment
  questions:
  - kind: short_answer
    prompt: Reports open with an executive ___.
    answer: summary
    competency: security-reporting
    explanation: Executive summary.
    points: 10
    hints: []
  - kind: mcq
    prompt: 'Each finding must include:'
    choices:
    - Only a title
    - Reproduction + remediation
    - A screenshot only
    - Nothing
    answer: Reproduction + remediation
    competency: security-reporting
    explanation: Reproducible and actionable.
    points: 10
    hints: []
  difficulty: intermediate
  passing_score: 70
  description: ''
