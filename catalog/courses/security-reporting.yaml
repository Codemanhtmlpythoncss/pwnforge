id: security-reporting
title: Security Reporting and Professional Practice
description: Communicate findings clearly, ethically and actionably.
difficulty: intermediate
category: methodology
specialization: methodology
estimated_minutes: 80
objectives:
- Understand writing a useful report
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
