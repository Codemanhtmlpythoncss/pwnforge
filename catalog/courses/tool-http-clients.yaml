lessons:
- title: curl essentials
  difficulty: easy
  minutes: 15
  competency: tool-http-clients
  body: 'curl makes any HTTP request, scriptably.


    ```

    curl -i http://10.200.0.10/            # show response headers

    curl -X POST -d ''a=1&b=2'' http://.../x # form POST

    curl -H ''Authorization: Bearer T'' .../ # custom header

    curl -b ''session=...'' .../             # send a cookie

    curl -sk https://.../ | jq .           # TLS, pipe JSON to jq

    ```

    `-i` shows headers, `-s` is quiet, `-k` skips cert checks (labs only).'
  exercises:
  - kind: command
    prompt: curl flag to include response headers?
    answer: -i
    competency: tool-http-clients
    explanation: '`-i` includes headers.'
    points: 10
    hints: []
  hints:
  - text: Pipe JSON APIs through `jq` to read them.
  walkthrough: []
- title: HTTPie for humans
  difficulty: easy
  minutes: 10
  competency: tool-http-clients
  body: 'HTTPie is a friendlier client: `http POST 10.200.0.10/login user=admin pass=admin` sends JSON
    by default with colourised output. Great for exploring an API quickly before scripting it with curl.'
  exercises:
  - kind: short_answer
    prompt: Friendly curl alternative with colour output?
    answer: httpie
    competency: tool-http-clients
    explanation: HTTPie.
    points: 10
    hints: []
  hints: []
  walkthrough: []
