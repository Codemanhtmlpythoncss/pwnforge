estimated_minutes: 100
objectives:
- Understand directory structure
- 'Understand authentication: kerberos basics'
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- windows-administration
competency_prereqs: []
tags:
- identity
references: []
os_requirements: []
lab_id: enterprise-identity-lab
version: 1.0.0
lessons:
- title: Directory structure
  difficulty: intermediate
  minutes: 20
  competency: ad-fundamentals
  body: Active Directory is a hierarchical directory of objects (users, computers, groups) organised into
    domains and Organisational Units (OUs). Domain Controllers (DCs) hold the directory and authenticate
    users. Group Policy applies settings across OUs. Understanding this structure is prerequisite to any
    identity-security work.
  exercises:
  - kind: mcq
    prompt: Which server authenticates domain users?
    choices:
    - File server
    - Domain Controller
    - Print server
    - DHCP server
    answer: Domain Controller
    competency: ad-fundamentals
    explanation: DCs hold the directory and authenticate users.
    points: 10
    hints: []
  hints:
  - text: OUs are containers for delegation and policy.
  walkthrough: []
- title: 'Authentication: Kerberos basics'
  difficulty: intermediate
  minutes: 20
  competency: kerberos
  body: 'AD uses Kerberos: a client gets a Ticket Granting Ticket (TGT) from the DC, then requests service
    tickets. Tickets, service principal names (SPNs) and delegation settings are central to both AD operation
    and its security. Misconfigured delegation and weak service-account passwords are common enterprise
    weaknesses to recognise and remediate.'
  exercises:
  - kind: short_answer
    prompt: What ticket does a client first obtain from the DC? (___)
    answer: TGT
    competency: kerberos
    explanation: The Ticket Granting Ticket comes first.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Trace an identity's effective access
  difficulty: intermediate
  minutes: 20
  competency: ad-fundamentals
  body: 'For an account, trace authentication, group membership, assigned roles, and the resources those
    roles can reach. Effective access is the combined result of direct grants, inherited group permissions,
    and policy. Check both the intended path and unintended paths; a user may inherit access from a nested
    group or stale assignment.


    Use the methods from **Active Directory Fundamentals** to work this checklist:


    - Understand directory structure

    - Understand authentication: kerberos basics


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: Which principle limits accounts to only the access they need?
    choices:
    - Least privilege
    - Open access
    - Security by obscurity
    - Shared administration
    answer: Least privilege
    competency: ad-fundamentals
    explanation: Least privilege limits standing permissions to the minimum required for the role.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Reduce standing privilege
  difficulty: intermediate
  minutes: 20
  competency: ad-fundamentals
  body: 'Remove permissions only after identifying the owner and required workflow. Prefer a narrow role
    over a broad administrator grant, use separate privileged accounts, and define how elevated access
    is approved and reviewed. Verify the new effective access with a representative allowed action and
    a representative denied action. Record the account, role, resource, and evidence for each result.


    ## Apply this to Active Directory Fundamentals


    Domains, organisational units, trusts and authentication in AD.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: ad-fundamentals
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
