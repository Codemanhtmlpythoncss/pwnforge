    hints: []
  - kind: short_answer
    prompt: Protocol AD uses for authentication?
    answer: Kerberos
    competency: kerberos
    explanation: AD primarily uses Kerberos.
    points: 10
    hints: []
  difficulty: intermediate
  passing_score: 70
