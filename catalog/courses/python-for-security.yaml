id: python-for-security
title: Python for Security
description: Use Python to build small security tools and automate analysis.
difficulty: intermediate
category: scripting
specialization: reverse
estimated_minutes: 95
objectives:
- Understand python essentials for tooling
- Understand parsing and reporting
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- bash-for-security
competency_prereqs: []
tags:
- scripting
references: []
os_requirements: []
lab_id: null
version: 1.0.0
lessons:
- title: Python essentials for tooling
  difficulty: intermediate
  minutes: 20
  competency: python-security
  body: 'Python''s standard library covers most security tasks: `socket` for network I/O, `hashlib` for
    hashing, `re` for parsing, `argparse` for CLIs, `requests` for HTTP. Write small, testable functions.
    Prefer `subprocess.run([...])` with a list (never `shell=True` on untrusted input) to avoid command
    injection.'
  exercises:
  - kind: mcq
    prompt: Safest way to call an external command on untrusted input?
    choices:
    - os.system(s)
    - subprocess.run([...]) with a list and no shell
    - eval(s)
    - shell=True
    answer: subprocess.run([...]) with a list and no shell
    competency: secure-coding
    explanation: A list argv avoids shell interpretation.
    points: 10
    hints: []
  hints:
  - text: Avoid shell=True with external input.
  walkthrough: []
- title: Parsing and reporting
  difficulty: intermediate
  minutes: 15
  competency: python-security
  body: Security data is often semi-structured. Use `csv`, `json` and `re` to parse logs and emit clean
    reports. Hashing with `hashlib.sha256` lets you verify file integrity. Keep secrets out of code and
    logs.
  exercises:
  - kind: short_answer
    prompt: stdlib module for SHA-256 hashing?
    answer: hashlib
    competency: python-security
    explanation: '`hashlib` provides SHA-256.'
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Make security scripts predictable
  difficulty: intermediate
  minutes: 20
  competency: python-security
  body: 'A useful automation script has a narrow input, a clear output, and safe defaults. Quote variable
    expansions, validate file paths and target ranges, and keep secrets out of command-line arguments
    and logs. In Bash, use explicit exit checks and distinguish standard output from errors. In Python,
    parse structured data with a parser rather than regular expressions when a format has a real grammar.


    Use the methods from **Python for Security** to work this checklist:


    - Understand python essentials for tooling

    - Understand parsing and reporting


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: Why should shell variable expansions generally be quoted?
    choices:
    - To prevent word splitting and glob expansion
    - To make scripts run as root
    - To disable exit codes
    - To encrypt the variable
    answer: To prevent word splitting and glob expansion
    competency: python-security
    explanation: Quoting keeps spaces and wildcard characters inside the intended argument.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Validate input and handle failures
  difficulty: intermediate
  minutes: 20
  competency: python-security
  body: 'Test a script with a normal input, an empty input, malformed data, and a permission or network
    failure. Confirm that a failure returns a non-zero status and does not leave partial output that looks
    successful. Make repeated runs safe: use temporary files, atomic replacement where appropriate, and
    document destructive options before enabling them.


    ## Apply this to Python for Security


    Use Python to build small security tools and automate analysis.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: python-security
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Python for Security Assessment
  questions:
  - kind: mcq
    prompt: Which avoids command injection?
    choices:
    - shell=True
    - argv list without a shell
    - eval
    - os.system
    answer: argv list without a shell
    competency: secure-coding
    explanation: Passing an argv list avoids shell parsing.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Module for regular expressions?
    answer: re
    competency: python-security
    explanation: '`re` handles regular expressions.'
    points: 10
    hints: []
  difficulty: intermediate
  passing_score: 70
  description: ''
