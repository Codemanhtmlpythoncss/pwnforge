id: tool-metasploit
title: Metasploit Framework (Lab Use)
description: Use the framework's modules, sessions and workflow against owned lab targets — and understand
  how defenders detect it.
difficulty: hard
category: tools
specialization: pentest
estimated_minutes: 115
objectives:
- Understand msfconsole & the module model
- Understand exploits, payloads & sessions
- Understand post-exploitation & detection
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- penetration-testing-methodology
- tool-nmap
competency_prereqs: []
tags:
- tool
- hands-on
references: []
os_requirements: []
lab_id: enterprise-identity-lab
version: 1.0.0
lessons:
- title: msfconsole & the module model
  difficulty: hard
  minutes: 20
  competency: tool-exploitation-frameworks
  body: 'Metasploit organises capability into **modules**: `auxiliary` (scanners/enum), `exploit`, `payload`,
    `post`, `encoder`.


    ```

    msfconsole

    search type:auxiliary smb

    use auxiliary/scanner/smb/smb_version

    set RHOSTS 10.200.0.10

    run

    ```

    `show options` lists required settings; `info` explains a module. Start with auxiliary scanners to
    enumerate your lab before anything else.


    > Only run these tools against systems you own or are explicitly authorised to test — the Pwnforge
    labs are built for exactly this. Unauthorised scanning or access is unethical and usually unlawful.'
  exercises:
  - kind: short_answer
    prompt: Module type for scanners/enumeration?
    answer: auxiliary
    competency: tool-exploitation-frameworks
    explanation: auxiliary modules.
    points: 10
    hints: []
  hints:
  - text: '`show options` reveals what a module needs (RHOSTS etc.).'
  - text: Prefer auxiliary scanners first to map the lab.
  walkthrough: []
- title: Exploits, payloads & sessions
  difficulty: hard
  minutes: 20
  competency: tool-exploitation-frameworks
  body: 'An `exploit` module delivers a `payload`; a staged payload opens a **session** (e.g. Meterpreter)
    back to a handler.


    ```

    use exploit/...

    set RHOSTS 10.200.0.10

    set PAYLOAD <payload>

    set LHOST <your-lab-ip>

    exploit

    sessions -l

    ```

    `LHOST` is where the session connects back — your attacker host on the lab network. Everything stays
    inside the isolated lab.'
  exercises:
  - kind: mcq
    prompt: '`LHOST` specifies:'
    choices:
    - The target
    - Your listener/host
    - A port only
    - The payload
    answer: Your listener/host
    competency: tool-exploitation-frameworks
    explanation: Where the session connects back.
    points: 10
    hints: []
  hints: []
  walkthrough:
  - title: Start an infra lab
    detail: Owned targets on an isolated net.
  - title: Enumerate
    detail: Use an auxiliary scanner module first.
  - title: Configure
    detail: '`set RHOSTS`, `PAYLOAD`, `LHOST`.'
  - title: Review sessions
    detail: '`sessions -l`; clean up when done.'
- title: Post-exploitation & detection
  difficulty: hard
  minutes: 15
  competency: detection-engineering
  body: '`post` modules gather information after access. Crucially, learn the defender''s view: framework
    activity leaves artefacts (process creation, network patterns, auth events) that detections key on.
    Knowing how the tool behaves makes you a better blue-teamer.'
  exercises:
  - kind: short_answer
    prompt: Module category that runs after access?
    answer: post
    competency: tool-exploitation-frameworks
    explanation: post modules.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Choose a tool for a specific question
  difficulty: intermediate
  minutes: 20
  competency: tool-exploitation-frameworks
  body: 'State the question you need answered before choosing a scanner, proxy, packet analyser, or password
    auditor. Confirm the target and limits, select the smallest useful option set, and save the complete
    output with tool version and timestamp. Understand what the tool measures and what it cannot see;
    a result may be incomplete because of filtering, authentication, or protocol behaviour.


    Use the methods from **Metasploit Framework (Lab Use)** to work this checklist:


    - Understand msfconsole & the module model

    - Understand exploits, payloads & sessions

    - Understand post-exploitation & detection


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What should you do with a security tool's important result?
    choices:
    - Validate it with evidence
    - Assume it is always correct
    - Ignore its scope
    - Publish it without review
    answer: Validate it with evidence
    competency: tool-exploitation-frameworks
    explanation: Tools are aids to analysis; validate important output and preserve enough context to
      reproduce it.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Validate tool output and preserve context
  difficulty: intermediate
  minutes: 20
  competency: tool-exploitation-frameworks
  body: 'Verify important results with a second method or direct observation. For a finding, include the
    command or request, relevant output, target, and time. Avoid broad or high-rate options when a narrow
    check answers the question. Keep credentials and tokens out of saved transcripts, and stop if the
    tool behaves outside the authorised scope.


    ## Apply this to Metasploit Framework (Lab Use)


    Use the framework''s modules, sessions and workflow against owned lab targets — and understand how
    defenders detect it.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: tool-exploitation-frameworks
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
