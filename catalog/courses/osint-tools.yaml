id: osint-tools
title: OSINT Tooling
description: 'The practical toolkit for authorised, public-source collection: search operators, theHarvester,
  Amass, recon-ng, Shodan, dnsrecon and username/metadata tools.'
difficulty: intermediate
category: osint
specialization: osint
estimated_minutes: 110
objectives:
- Understand search operators & dorking
- Understand domain & infrastructure recon
- Understand people, usernames & metadata
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- osint-techniques
competency_prereqs:
- osint-techniques
tags:
- osint
- recon
references: []
os_requirements: []
lab_id: osint-investigation-lab
version: 1.0.0
lessons:
- title: Search operators & dorking
  difficulty: intermediate
  minutes: 15
  competency: osint-tooling
  body: 'Advanced search operators are the most powerful OSINT ''tool'' of all: `site:`, `filetype:`,
    `intitle:`, exact phrases and date ranges turn a search engine into a precise collector of **public**
    information. Used ethically, ''dorking'' finds inadvertently-public documents an organisation should
    lock down — a defensive win as much as a collection technique.'
  exercises:
  - kind: short_answer
    prompt: Operator restricting results to one domain?
    answer: 'site:'
    competency: osint-tooling
    explanation: 'site: filters by domain.'
    points: 10
    hints: []
  hints:
  - text: 'Combine operators: site:example.com filetype:pdf'
  walkthrough: []
- title: Domain & infrastructure recon
  difficulty: intermediate
  minutes: 20
  competency: osint-tooling
  body: 'Public technical sources map an org''s footprint.


    ```

    whois example.com

    dnsrecon -d example.com

    theHarvester -d example.com -b bing      # public emails/subdomains

    amass enum -passive -d example.com        # passive subdomain enum

    ```

    Prefer **passive** modes (public data only). Certificate-transparency logs (crt.sh) and public DNS
    reveal subdomains without touching the target. This is the recon a defender runs on themselves to
    find exposure.'
  exercises:
  - kind: command
    prompt: Passive subdomain enumeration (amass enum -___ -d ...)?
    answer: -passive
    competency: osint-tooling
    explanation: '`-passive` uses public sources only.'
    points: 10
    hints: []
  hints: []
  walkthrough:
  - title: whois
    detail: Start with `whois` for registration data.
  - title: DNS
    detail: Run `dnsrecon`/dig for records.
  - title: Passive subdomains
    detail: Use amass -passive and crt.sh.
  - title: Corroborate
    detail: Cross-check findings before reporting.
- title: People, usernames & metadata
  difficulty: intermediate
  minutes: 15
  competency: osint-tooling
  body: 'recon-ng is a modular framework that organises public lookups into a workspace with a database.
    Username tools (e.g. Sherlock) check where a handle appears across public sites; `exiftool` reads
    public file metadata. Apply the same ethics: minimise collection, respect privacy, and record provenance
    for every finding.'
  exercises:
  - kind: short_answer
    prompt: Modular OSINT framework with a workspace/db?
    answer: recon-ng
    competency: osint-tooling
    explanation: recon-ng.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Plan a bounded public-source investigation
  difficulty: intermediate
  minutes: 20
  competency: osint-tooling
  body: 'Define the question, subject, timeframe, lawful basis, and collection limits before searching.
    Prefer primary sources and retain the exact URL, collection time, and relevant excerpt. Keep personal
    data to the minimum needed. A search result snippet is a lead; open and assess the source before treating
    it as evidence.


    Use the methods from **OSINT Tooling** to work this checklist:


    - Understand search operators & dorking

    - Understand domain & infrastructure recon

    - Understand people, usernames & metadata


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: Which fields make a public-source observation auditable?
    choices:
    - Source, collection time, and confidence
    - Colour, font, and page size
    - Search order only
    - The analyst's guess
    answer: Source, collection time, and confidence
    competency: osint-tooling
    explanation: Provenance, time, and confidence help another analyst assess an OSINT observation.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Corroborate claims and write with confidence
  difficulty: intermediate
  minutes: 20
  competency: osint-tooling
  body: 'Corroborate important claims with independent sources and check whether they refer to the same
    person, organisation, or time period. Record confidence and contradictory evidence. Separate fact
    from inference in the report, explain source limitations, and remove sensitive details that do not
    support the stated purpose.


    ## Apply this to OSINT Tooling


    The practical toolkit for authorised, public-source collection: search operators, theHarvester, Amass,
    recon-ng, Shodan, dnsrecon and username/metadata tools.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: osint-tooling
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
