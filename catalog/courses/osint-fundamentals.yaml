id: osint-fundamentals
title: OSINT Fundamentals
description: What open-source intelligence is, where it comes from, and the ethics and legality that must
  govern every investigation.
difficulty: easy
category: osint
specialization: osint
estimated_minutes: 65
objectives:
- Understand what osint is (and isn't)
- Understand the intelligence cycle
- Understand ethics, legality and privacy
