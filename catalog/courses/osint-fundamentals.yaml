lessons:
- title: What OSINT is (and isn't)
  difficulty: easy
  minutes: 15
  competency: osint-fundamentals
  body: 'Open-source intelligence (OSINT) is intelligence produced from **publicly available** information:
    websites, public records, maps, public social posts, press, and technical sources like DNS and certificate
    transparency logs. OSINT does **not** mean accessing private accounts, bypassing authentication, or
    social-engineering people — those are out of scope and often unlawful. Good OSINT is disciplined collection
    and analysis of information anyone could lawfully see.'
  exercises:
  - kind: mcq
    prompt: Which is within OSINT scope?
    choices:
    - Logging into someone's private account
    - Reading a public certificate-transparency log
    - Guessing a password
    - Phishing a target
    answer: Reading a public certificate-transparency log
    competency: osint-fundamentals
    explanation: OSINT uses genuinely public sources only.
    points: 10
    hints: []
  hints:
  - text: If it requires defeating a control or deceiving a person, it isn't OSINT.
  walkthrough: []
- title: The intelligence cycle
  difficulty: easy
  minutes: 15
  competency: osint-fundamentals
  body: 'Professional OSINT follows a cycle: **plan** (define the question and scope) → **collect** (gather
    from public sources) → **process** (organise and de-duplicate) → **analyse** (corroborate, assess
    reliability) → **report** (communicate clearly, with sources). Jumping straight to collection without
    a question produces noise; skipping corroboration produces false conclusions.'
  exercises:
  - kind: short_answer
    prompt: The cycle step that defines the question and scope is ___.
    answer: plan
    competency: osint-fundamentals
    explanation: Planning comes first.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Ethics, legality and privacy
  difficulty: easy
  minutes: 15
  competency: osint-ethics
  body: OSINT operates under law and ethics. Respect terms of service, data-protection law (e.g. GDPR),
    and the difference between *public* and *private*. Minimise collection to what the authorised question
    needs, avoid harassment, and never repurpose personal data. A lawful source does not make every use
    lawful — purpose and proportionality matter.
  exercises:
  - kind: mcq
    prompt: 'A record is public. Collecting everything about a private individual ''just in case'' is:'
    choices:
    - Fine — it's public
    - Disproportionate and likely unlawful
    - Required
    - Good practice
    answer: Disproportionate and likely unlawful
    competency: osint-ethics
    explanation: Minimise to the authorised question; proportionality matters.
    points: 10
    hints: []
  hints:
  - text: Public source ≠ unlimited use. Mind purpose and proportionality.
  walkthrough: []
- title: Plan a bounded public-source investigation
  difficulty: intermediate
  minutes: 20
  competency: osint-fundamentals
  body: 'Define the question, subject, timeframe, lawful basis, and collection limits before searching.
    Prefer primary sources and retain the exact URL, collection time, and relevant excerpt. Keep personal
    data to the minimum needed. A search result snippet is a lead; open and assess the source before treating
    it as evidence.


    Use the methods from **OSINT Fundamentals** to work this checklist:


    - Understand what osint is (and isn''t)

    - Understand the intelligence cycle

    - Understand ethics, legality and privacy


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: Which fields make a public-source observation auditable?
    choices:
    - Source, collection time, and confidence
    - Colour, font, and page size
    - Search order only
    - The analyst's guess
    answer: Source, collection time, and confidence
    competency: osint-fundamentals
    explanation: Provenance, time, and confidence help another analyst assess an OSINT observation.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Corroborate claims and write with confidence
  difficulty: intermediate
  minutes: 20
  competency: osint-fundamentals
  body: 'Corroborate important claims with independent sources and check whether they refer to the same
    person, organisation, or time period. Record confidence and contradictory evidence. Separate fact
    from inference in the report, explain source limitations, and remove sensitive details that do not
    support the stated purpose.


    ## Apply this to OSINT Fundamentals


    What open-source intelligence is, where it comes from, and the ethics and legality that must govern
    every investigation.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: osint-fundamentals
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
