id: tool-ghidra
title: 'Ghidra: Reverse Engineering'
description: Disassemble and decompile binaries with the NSA's open-source SRE suite.
difficulty: advanced
category: tools
specialization: reverse
estimated_minutes: 95
objectives:
- Understand projects, disassembly & decompiler
- Understand strings, xrefs & patching
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- reverse-engineering-fundamentals
competency_prereqs: []
tags:
- tool
- hands-on
references: []
os_requirements: []
lab_id: reverse-engineering-lab
version: 1.0.0
lessons:
- title: Projects, disassembly & decompiler
  difficulty: advanced
  minutes: 20
  competency: tool-re-tooling
  body: Ghidra imports a binary, auto-analyses it, and shows disassembly alongside a C-like **decompiler**
    view. Navigate the Symbol Tree and function list; rename variables and add comments as you understand
    them. The decompiler is the fastest way to grasp logic before diving into assembly. Analyse only binaries
    you're permitted to, inside isolation.
  exercises:
  - kind: mcq
    prompt: 'Ghidra''s standout feature vs a plain disassembler:'
    choices:
    - GPU cracking
    - A decompiler (C-like view)
    - A web proxy
    - Packet capture
    answer: A decompiler (C-like view)
    competency: tool-re-tooling
    explanation: The decompiler.
    points: 10
    hints: []
  hints:
  - text: Rename symbols as you learn them — future-you will thank you.
  walkthrough: []
- title: Strings, xrefs & patching
  difficulty: advanced
  minutes: 15
  competency: tool-re-tooling
  body: '`Window → Defined Strings` finds literals; cross-references (xrefs) show who calls/uses a function
    or string — the fastest path to the interesting code. Ghidra can also patch instructions and export,
    useful for CrackMe-style lab challenges.'
  exercises:
  - kind: short_answer
    prompt: 'Show who references a function/string: x___.'
    answer: refs
    competency: tool-re-tooling
    explanation: Cross-references (xrefs).
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Choose a tool for a specific question
  difficulty: intermediate
  minutes: 20
  competency: tool-re-tooling
  body: 'State the question you need answered before choosing a scanner, proxy, packet analyser, or password
    auditor. Confirm the target and limits, select the smallest useful option set, and save the complete
    output with tool version and timestamp. Understand what the tool measures and what it cannot see;
    a result may be incomplete because of filtering, authentication, or protocol behaviour.


    Use the methods from **Ghidra: Reverse Engineering** to work this checklist:


    - Understand projects, disassembly & decompiler

    - Understand strings, xrefs & patching


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What should you do with a security tool's important result?
    choices:
    - Validate it with evidence
    - Assume it is always correct
    - Ignore its scope
    - Publish it without review
    answer: Validate it with evidence
    competency: tool-re-tooling
    explanation: Tools are aids to analysis; validate important output and preserve enough context to
      reproduce it.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Validate tool output and preserve context
  difficulty: intermediate
  minutes: 20
  competency: tool-re-tooling
  body: 'Verify important results with a second method or direct observation. For a finding, include the
    command or request, relevant output, target, and time. Avoid broad or high-rate options when a narrow
    check answers the question. Keep credentials and tokens out of saved transcripts, and stop if the
    tool behaves outside the authorised scope.


    ## Apply this to Ghidra: Reverse Engineering


    Disassemble and decompile binaries with the NSA''s open-source SRE suite.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: tool-re-tooling
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: 'Ghidra: Reverse Engineering Assessment'
  questions:
  - kind: mcq
    prompt: 'Ghidra provides a:'
    choices:
    - Decompiler
    - GPU cracker
    - Proxy
    - Fuzzer
    answer: Decompiler
    competency: tool-re-tooling
    explanation: C-like decompiler.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Follow who uses a function via cross-___.
    answer: references
    competency: tool-re-tooling
    explanation: Cross-references.
    points: 10
    hints: []
  difficulty: advanced
  passing_score: 70
  description: ''
