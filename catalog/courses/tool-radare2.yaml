lessons:
- title: Opening and navigating
  difficulty: advanced
  minutes: 20
  competency: tool-re-tooling
  body: 'radare2 is terminal-driven.


    ```

    r2 ./binary

    aaa        # analyse all

    afl        # list functions

    s main      # seek to main

    pdf        # print disassembly of current function

    VV         # visual graph

    ```

    Commands compose: a letter per concept (`a` analyse, `p` print, `s` seek). It''s steep but fast once
    learned, and fully scriptable.'
  exercises:
  - kind: command
    prompt: radare2 command to analyse everything?
    answer: aaa
    competency: tool-re-tooling
    explanation: '`aaa` runs full analysis.'
    points: 10
    hints: []
  hints:
