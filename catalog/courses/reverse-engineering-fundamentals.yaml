id: reverse-engineering-fundamentals
title: Reverse Engineering Fundamentals
description: Static and dynamic analysis of compiled programs.
difficulty: advanced
category: reverse
specialization: reverse
estimated_minutes: 95
objectives:
- Understand static vs dynamic
- Understand binary formats
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- python-for-security
competency_prereqs: []
tags:
- reverse
references: []
os_requirements: []
lab_id: reverse-engineering-lab
version: 1.0.0
lessons:
- title: Static vs dynamic
  difficulty: advanced
  minutes: 20
  competency: reverse-engineering
  body: Static analysis examines a binary without running it (disassembly, strings, structure); dynamic
    analysis observes it executing in a controlled, isolated environment under a debugger. Each reveals
    what the other hides. Always analyse untrusted binaries inside isolation, exactly like Pwnforge's
    disposable VMs.
  exercises:
  - kind: mcq
    prompt: 'Dynamic analysis means:'
    choices:
    - Reading source
    - Observing execution in isolation
    - Compiling
    - Signing
    answer: Observing execution in isolation
    competency: reverse-engineering
    explanation: Dynamic = running it safely.
    points: 10
    hints: []
  hints:
  - text: Combine both; isolate always.
  walkthrough: []
- title: Binary formats
  difficulty: advanced
  minutes: 15
  competency: binary-formats
  body: ELF (Linux) and PE (Windows) binaries have headers, sections (code, data) and symbol/import tables.
    Reading these structures tells you how a program is laid out before you ever look at instructions.
  exercises:
  - kind: short_answer
    prompt: Linux executable format (acronym)?
    answer: ELF
    competency: binary-formats
    explanation: ELF on Linux.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Triage a binary without executing it
  difficulty: intermediate
  minutes: 20
  competency: reverse-engineering
  body: 'Before analysis, record the sample''s source and calculate a hash. Use `file`, metadata tools,
    strings, and section/import listings to learn what the file appears to be. Treat embedded text as
    clues, not proof. Inspect control flow and dangerous API use only after the basic file format and
    architecture are known.


    Use the methods from **Reverse Engineering Fundamentals** to work this checklist:


    - Understand static vs dynamic

    - Understand binary formats


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What is analysis of a binary without running it called?
    choices:
    - Static analysis
    - Dynamic analysis
    - Fuzzing
    - Packet capture
    answer: Static analysis
    competency: reverse-engineering
    explanation: Static analysis examines a file without executing it.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Analyse behaviour in a contained environment
  difficulty: intermediate
  minutes: 20
  competency: reverse-engineering
  body: 'If dynamic analysis is authorised, use a disposable snapshot with network access disabled or
    explicitly controlled. Observe process, file, registry, and network behaviour, then revert the snapshot.
    Compare observed behaviour with the static hypothesis and record differences. Never execute an unknown
    sample on a workstation that holds personal or production data.


    ## Apply this to Reverse Engineering Fundamentals


    Static and dynamic analysis of compiled programs.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: reverse-engineering
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Reverse Engineering Fundamentals Assessment
  questions:
