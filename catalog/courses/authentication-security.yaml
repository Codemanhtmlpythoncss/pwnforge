lessons:
- title: Storing credentials
  difficulty: intermediate
  minutes: 15
  competency: authn-security
  body: Passwords must be stored as salted, slow hashes (bcrypt, scrypt, Argon2) — never plaintext or
    fast hashes like raw SHA-256. Salting defeats precomputed tables; a slow algorithm defeats brute force.
    Pwnforge itself uses Argon2id for exactly this reason.
  exercises:
  - kind: mcq
    prompt: Which is appropriate for password storage?
    choices:
    - MD5
    - Plain SHA-256
    - Argon2id
    - Base64
    answer: Argon2id
    competency: authn-security
    explanation: Argon2id is a slow, salted KDF.
    points: 10
    hints: []
  hints:
  - text: Fast hashes are wrong for passwords.
  walkthrough: []
- title: MFA and lockout
  difficulty: intermediate
  minutes: 15
  competency: authn-security
  body: Multi-factor authentication adds a second factor so a stolen password is not enough. Rate limiting
    and lockout slow credential-guessing. Generic error messages avoid revealing whether a username exists.
    Together these harden the login flow.
  exercises:
  - kind: short_answer
    prompt: A second authentication factor is called ___ (acronym).
    answer: MFA
    competency: authn-security
    explanation: Multi-factor authentication.
    points: 10
    hints: []
  hints: []
  walkthrough: []
assessment:
