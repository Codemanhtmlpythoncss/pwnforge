id: access-control-course
title: Access Control
description: Authorisation models and enforcing them correctly.
difficulty: intermediate
category: web-security
specialization: web
estimated_minutes: 90
objectives:
- Understand authentication vs authorisation
- Understand idor and the confused deputy
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- web-application-security
competency_prereqs:
- access-control
tags:
- web
references: []
os_requirements: []
lab_id: web-security-lab
version: 1.0.0
lessons:
- title: Authentication vs authorisation
  difficulty: intermediate
  minutes: 15
  competency: access-control
  body: Authentication proves *who* you are; authorisation decides *what* you may do. Broken access control
    — missing server-side checks, IDs you can tamper with, trusting the client — is consistently among
    the most common web risks. Every sensitive action must be checked server-side against the current
    user.
  exercises:
  - kind: mcq
    prompt: 'Authorisation decides:'
    choices:
    - Who you are
    - What you may do
    - Your IP
    - Your browser
    answer: What you may do
    competency: access-control
    explanation: Authorisation governs permitted actions.
    points: 10
    hints: []
  hints:
  - text: Never trust the client to enforce access.
  walkthrough: []
- title: IDOR and the confused deputy
  difficulty: intermediate
  minutes: 15
  competency: access-control
  body: 'Insecure Direct Object Reference (IDOR) lets a user access another''s object by changing an identifier
    because the server failed to check ownership. The fix: always verify the current user is authorised
    for the specific object, server-side, on every request. Pwnforge enforces per-user ownership on labs
    and terminals for exactly this reason.'
  exercises:
  - kind: short_answer
    prompt: Accessing another user's record by changing an id is called ___ (acronym).
    answer: IDOR
    competency: access-control
    explanation: Insecure Direct Object Reference.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Trace a browser request through the application
  difficulty: intermediate
  minutes: 20
  competency: access-control
  body: 'Follow an input from the request into application logic, storage, and the response. Identify
    the trust boundary at each step. Authentication answers who the user is; authorization decides what
    that user may do. For output, note whether data enters HTML text, an attribute, JavaScript, or a URL,
    because each context needs the correct encoding. For database operations, parameterize values rather
    than joining user text into query strings.


    Use the methods from **Access Control** to work this checklist:


    - Understand authentication vs authorisation

    - Understand idor and the confused deputy


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What should be used for values in a database query?
    choices:
    - Parameterized queries
    - String concatenation
    - A hidden form field
    - Client-side validation alone
    answer: Parameterized queries
    competency: access-control
    explanation: Parameterized queries keep user-controlled values separate from SQL syntax.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Verify fixes at the right context
  difficulty: intermediate
  minutes: 20
  competency: access-control
  body: 'Use a harmless test value in an authorised environment and record the request, response, and
    affected account. Change one control, then repeat the same request and confirm the unsafe result is
    gone. Also verify normal input still succeeds and access checks apply to direct API requests, not
    only hidden or disabled buttons. Document the exact affected route and the evidence supporting the
    result.


    ## Apply this to Access Control


    Authorisation models and enforcing them correctly.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: access-control
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Access Control Assessment
  questions:
  - kind: mcq
    prompt: Where must access checks happen?
    choices:
    - Client only
    - Server-side
    - In the cookie
    - In DNS
    answer: Server-side
    competency: access-control
    explanation: Authorisation must be enforced server-side.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Broken ___ control is a top web risk.
    answer: access
    competency: access-control
    explanation: Broken access control.
    points: 10
    hints: []
  difficulty: intermediate
  passing_score: 70
  description: ''
