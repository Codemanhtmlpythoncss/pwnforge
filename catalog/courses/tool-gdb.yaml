lessons:
- title: Breakpoints, stepping & inspection
  difficulty: advanced
  minutes: 20
  competency: tool-re-tooling
  body: 'gdb runs a program under your control; pwndbg/GEF add security-focused views.


    ```

    gdb ./binary

    b main          # breakpoint

    run

    ni / si         # next / step instruction

    info registers

    x/16xw $sp      # examine 16 words at the stack pointer

    ```

    Watching registers and memory as code executes reveals what static analysis can''t. Do this on binaries
    you''re authorised to analyse, in isolation.'
  exercises:
  - kind: command
    prompt: gdb command to set a breakpoint at main?
    answer: b main
    competency: tool-re-tooling
    explanation: '`b main` breaks at main.'
    points: 10
    hints: []
  hints:
  - text: '`x/` examines memory; `info registers` dumps CPU state.'
  walkthrough: []
