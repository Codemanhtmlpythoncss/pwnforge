id: digital-forensics
title: Digital Forensics
description: Handle evidence and examine artefacts soundly.
difficulty: intermediate
category: forensics
specialization: forensics
estimated_minutes: 95
objectives:
- Understand evidence integrity
- Understand filesystem artefacts
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- linux-administration
competency_prereqs: []
tags:
- forensics
references: []
os_requirements: []
lab_id: forensics-workstation-lab
version: 1.0.0
lessons:
- title: Evidence integrity
  difficulty: intermediate
  minutes: 20
  competency: evidence-handling
  body: 'Sound forensics preserves evidence integrity: hash data on acquisition, work from copies, and
    maintain a chain of custody. If integrity is not provable, conclusions are not defensible. Document
    every action with timestamps.'
  exercises:
  - kind: mcq
    prompt: 'First step to preserve evidence integrity:'
    choices:
    - Edit the file
    - Hash and work from a copy
    - Delete logs
    - Reboot
    answer: Hash and work from a copy
    competency: evidence-handling
    explanation: Hash, then analyse copies.
    points: 10
    hints: []
  hints:
  - text: Never analyse the only copy.
  walkthrough: []
- title: Filesystem artefacts
  difficulty: intermediate
  minutes: 15
  competency: filesystems
  body: Filesystems store timestamps (MACB), deleted-file remnants and metadata that reconstruct activity.
    Understanding how a filesystem records changes lets you build an accurate timeline and spot tampering.
  exercises:
  - kind: short_answer
    prompt: Timestamps help build a ___.
    answer: timeline
    competency: timeline-analysis
    explanation: Timelines from timestamps.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Preserve evidence before analysis
  difficulty: intermediate
  minutes: 20
  competency: evidence-handling
  body: 'Record who collected the evidence, when, from which system, with which tool and settings. Preserve
    the original and work from a verified copy. Calculate a cryptographic hash at acquisition and compare
    it after transfer or analysis. Keep timestamps with their original time zone and distinguish file-system
    times from the time an event actually occurred.


    Use the methods from **Digital Forensics** to work this checklist:


    - Understand evidence integrity

    - Understand filesystem artefacts


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What is a hash used for in evidence handling?
    choices:
    - Checking whether evidence changed
    - Encrypting a disk image
    - Replacing chain of custody
    - Proving who created a file
    answer: Checking whether evidence changed
    competency: evidence-handling
    explanation: A cryptographic hash can reveal whether the evidence bytes changed; it does not replace
      custody records.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Correlate artefacts without overstating them
  difficulty: intermediate
  minutes: 20
  competency: evidence-handling
  body: 'Build a timeline from multiple artefacts and explain the source of each timestamp. A browser
    record, log entry, and packet capture may describe the same event from different clocks. Note gaps,
    collection limits, and alternative explanations. Your conclusion should be reproducible from the evidence
    and should not claim more than the artefacts support.


    ## Apply this to Digital Forensics


    Handle evidence and examine artefacts soundly.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: evidence-handling
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Digital Forensics Assessment
  questions:
  - kind: mcq
    prompt: 'Chain of custody documents:'
    choices:
    - Disk speed
    - Who handled evidence and when
    - CPU model
    - RAM
    answer: Who handled evidence and when
    competency: evidence-handling
    explanation: It tracks handling.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Acquire then verify with a ___.
    answer: hash
    competency: evidence-handling
    explanation: Hashes prove integrity.
    points: 10
    hints: []
  difficulty: intermediate
  passing_score: 70
  description: ''
