lessons:
- title: Hash modes & attack modes
  difficulty: hard
  minutes: 20
  competency: tool-password-auditing
  body: 'Hashcat needs the **hash mode** (`-m`) and **attack mode** (`-a`).


    ```

    hashcat -m 0 -a 0 hashes.txt rockyou.txt     # MD5, straight wordlist

    hashcat -m 1000 -a 0 ntlm.txt rockyou.txt     # NTLM

    hashcat -m 0 -a 3 hashes.txt ''?l?l?l?l?d?d''    # mask (brute)

    hashcat --show -m 0 hashes.txt

    ```

    `-a 0` = wordlist, `-a 3` = mask/brute. `hashid`/`hashcat --identify` helps spot the mode. Audit only
    hashes you''re authorised to test.'
  exercises:
  - kind: command
    prompt: Hashcat flag that sets the hash type?
    answer: -m
    competency: tool-password-auditing
    explanation: '`-m` sets hash mode.'
    points: 10
    hints: []
  hints:
  - text: '`-a 0` wordlist, `-a 3` mask; `-m` picks the hash type.'
  walkthrough: []
