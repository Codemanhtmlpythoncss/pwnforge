id: docker-security
title: Docker Security
description: Container isolation, image hygiene and runtime safety.
difficulty: intermediate
category: container
specialization: cloud
estimated_minutes: 95
objectives:
- Understand how containers isolate
- Understand image hygiene
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- linux-administration
competency_prereqs: []
tags:
- container
- container
references: []
os_requirements: []
lab_id: container-security-lab
version: 1.0.0
lessons:
- title: How containers isolate
  difficulty: intermediate
  minutes: 20
  competency: docker-security
  body: 'Containers share the host kernel and isolate processes with namespaces and cgroups. They are
    not VMs: a container escape reaches the host. Security basics: run as non-root, drop capabilities,
    use read-only filesystems where possible, and never mount the Docker socket into untrusted containers.'
  exercises:
  - kind: mcq
    prompt: 'Containers isolate using:'
    choices:
    - A separate kernel
    - Namespaces and cgroups
    - A hypervisor
    - TLS
    answer: Namespaces and cgroups
    competency: docker-security
    explanation: Namespaces + cgroups, shared kernel.
    points: 10
    hints: []
  hints:
  - text: Container != VM; kernel is shared.
  walkthrough: []
- title: Image hygiene
  difficulty: intermediate
  minutes: 15
  competency: docker-security
  body: Minimal base images reduce attack surface; pin versions; scan for known vulnerable packages; never
    bake secrets into layers (they persist in history). A clean, minimal, scanned image is the baseline
    of container security.
  exercises:
  - kind: short_answer
    prompt: Secrets baked into image layers persist in the ___.
    answer: history
    competency: docker-security
    explanation: Layer history keeps them.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Inspect the container's full trust boundary
  difficulty: intermediate
  minutes: 20
  competency: docker-security
  body: 'Review the image source and digest, user identity, capabilities, mounts, secrets, network attachments,
    and exposed ports. A container shares the host kernel, so a root process, privileged mode, or writable
    host mount can expand impact beyond the container. Check what the workload actually needs instead
    of assuming the image''s defaults are safe.


    Use the methods from **Docker Security** to work this checklist:


    - Understand how containers isolate

    - Understand image hygiene


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: Which principle should guide container capabilities and privileges?
    choices:
    - Least privilege
    - Privileged by default
    - Shared root access
    - Disable logging
    answer: Least privilege
    competency: docker-security
    explanation: Containers should receive only the privileges and capabilities the workload requires.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Reduce runtime privilege and verify isolation
  difficulty: intermediate
  minutes: 20
  competency: docker-security
  body: 'Apply one restriction at a time: run as a non-root user, drop unused capabilities, make the filesystem
    read-only where possible, limit resources, and use narrow network policy. Verify the workload still
    functions, then inspect the effective runtime configuration rather than relying only on a deployment
    file. Record the image digest and policy evidence for repeatability.


    ## Apply this to Docker Security


    Container isolation, image hygiene and runtime safety.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: docker-security
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Docker Security Assessment
  questions:
  - kind: mcq
    prompt: 'Mounting the Docker socket into an untrusted container is:'
    choices:
    - Safe
    - Effectively host-level access
    - Required
    - Faster
    answer: Effectively host-level access
    competency: docker-security
    explanation: The socket grants host control.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Run containers as ___ (not root).
    answer: non-root
    competency: docker-security
    explanation: Least privilege.
    points: 10
    hints: []
  difficulty: intermediate
  passing_score: 70
  description: ''
