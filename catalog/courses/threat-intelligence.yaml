lessons:
- title: From data to decisions
  difficulty: hard
  minutes: 15
  competency: threat-intelligence
  body: 'Threat intelligence turns raw indicators and reports into decisions: which threats are relevant
    to you, what behaviours to detect, and where to invest. Prioritise by relevance to your environment;
    map adversary techniques to your detections and gaps.'
  exercises:
  - kind: mcq
    prompt: 'Good intel is prioritised by:'
    choices:
    - Volume
    - Relevance to your environment
    - Age
    - Source count
    answer: Relevance to your environment
    competency: threat-intelligence
    explanation: Relevance drives value.
    points: 10
    hints: []
  hints:
  - text: Relevance over volume.
  walkthrough: []
assessment:
  title: Threat Intelligence Assessment
  questions:
