lab_id: null
version: 1.0.0
lessons:
- title: How passwords should be stored
  difficulty: intermediate
  minutes: 15
  competency: password-security
  body: Systems must store passwords as salted, slow hashes (bcrypt/scrypt/Argon2). Auditing (in authorised
    settings) measures resistance to guessing and finds reused or weak credentials so they can be replaced.
    Strong policy favours length and uniqueness over arbitrary complexity rules.
  exercises:
  - kind: mcq
    prompt: 'Best stored-password property for defence:'
    choices:
    - Fast hashing
    - Salted slow hashing
    - Plaintext for recovery
    - Base64
    answer: Salted slow hashing
    competency: password-security
    explanation: Salt + slow KDF resists cracking.
    points: 10
    hints: []
  hints:
  - text: Length and uniqueness beat forced symbol rules.
  walkthrough: []
assessment:
  title: Password Security and Auditing Assessment
  questions:
  - kind: mcq
    prompt: 'Salting primarily defeats:'
    choices:
    - Network sniffing
    - Precomputed tables
    - Phishing
    - CSRF
    answer: Precomputed tables
    competency: password-security
    explanation: Salts defeat rainbow tables.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Modern password KDF used by Pwnforge?
    answer: argon2
    competency: password-security
    explanation: Argon2id.
    points: 10
    hints: []
  difficulty: intermediate
  passing_score: 70
  description: ''
