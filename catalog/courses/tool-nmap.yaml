lessons:
- title: Host discovery & your first scan
  difficulty: easy
  minutes: 20
  competency: tool-scanning
  body: 'Nmap maps what''s reachable and what''s listening.


    ```

    nmap -sn 10.200.0.0/24        # ping sweep: which hosts are up

    nmap 10.200.0.10              # default: top 1000 TCP ports

    nmap -p- 10.200.0.10          # all 65535 TCP ports

    nmap -p 22,80,443 10.200.0.10 # specific ports

    ```

    Start a Pwnforge lab and scan the target you own. Read every line: `open`, `closed` and `filtered`
    each mean something different (filtered usually implies a firewall).


    > Only run these tools against systems you own or are explicitly authorised to test — the Pwnforge
    labs are built for exactly this. Unauthorised scanning or access is unethical and usually unlawful.'
  exercises:
  - kind: command
    prompt: Scan ALL TCP ports on 10.0.0.5 (nmap -p- ...)
    answer: nmap -p- 10.0.0.5
    competency: tool-scanning
    explanation: '`-p-` scans all 65535 ports.'
    points: 10
    hints: []
  hints:
  - text: '`-sn` = no port scan, just host discovery.'
  - text: '`filtered` often means a firewall is dropping probes.'
  walkthrough: []
- title: Service & version detection, OS
  difficulty: easy
  minutes: 20
  competency: tool-scanning
  body: 'Knowing a port is open is step one; knowing *what* answers is the goal.


    ```

    nmap -sV 10.200.0.10          # service/version detection

    nmap -sV -sC 10.200.0.10      # + default safe NSE scripts

    nmap -O 10.200.0.10           # OS guess (needs privilege)

    nmap -A 10.200.0.10           # aggressive: -sV -sC -O + traceroute

    ```

    `-sC` runs the *default* category of the Nmap Scripting Engine — safe, informative scripts. Record
    versions; they drive the whole assessment and tell a defender exactly what to patch.'
  exercises:
  - kind: command
    prompt: Enable service/version detection (flag)?
    answer: -sV
    competency: tool-scanning
    explanation: '`-sV` probes service versions.'
    points: 10
    hints: []
  hints: []
  walkthrough:
  - title: Start the Network Basics Lab
    detail: It gives you owned targets.
  - title: Sweep then scan
    detail: '`nmap -sn` the subnet, then `-sV -sC` a host.'
  - title: Record versions
    detail: Note service + version for each open port.
  - title: Map to risk
    detail: List known-weak versions to investigate/patch.
- title: NSE, timing & output
  difficulty: easy
  minutes: 15
  competency: tool-scanning
  body: 'The NSE has categories (`default`, `safe`, `vuln`, `auth`, ...): `nmap --script vuln 10.200.0.10`.
    Timing templates `-T0`..`-T5` trade speed for stealth/stability (`-T4` is a common lab default). Always
    save output: `-oA scan` writes normal/greppable/XML at once, which feeds reports and other tools.'
  exercises:
  - kind: command
    prompt: Save all three output formats with base name 'scan'
    answer: nmap -oA scan
    competency: tool-scanning
    explanation: '`-oA` writes .nmap/.gnmap/.xml.'
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Choose a tool for a specific question
  difficulty: intermediate
  minutes: 20
  competency: tool-scanning
  body: 'State the question you need answered before choosing a scanner, proxy, packet analyser, or password
    auditor. Confirm the target and limits, select the smallest useful option set, and save the complete
    output with tool version and timestamp. Understand what the tool measures and what it cannot see;
    a result may be incomplete because of filtering, authentication, or protocol behaviour.


    Use the methods from **Nmap: Network Scanning & Enumeration** to work this checklist:


    - Understand host discovery & your first scan

    - Understand service & version detection, os

    - Understand nse, timing & output


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What should you do with a security tool's important result?
    choices:
    - Validate it with evidence
    - Assume it is always correct
    - Ignore its scope
    - Publish it without review
    answer: Validate it with evidence
    competency: tool-scanning
    explanation: Tools are aids to analysis; validate important output and preserve enough context to
      reproduce it.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Validate tool output and preserve context
  difficulty: intermediate
  minutes: 20
  competency: tool-scanning
  body: 'Verify important results with a second method or direct observation. For a finding, include the
    command or request, relevant output, target, and time. Avoid broad or high-rate options when a narrow
    check answers the question. Keep credentials and tokens out of saved transcripts, and stop if the
    tool behaves outside the authorised scope.


    ## Apply this to Nmap: Network Scanning & Enumeration


    Discover hosts, find open ports, fingerprint services and run NSE scripts — the enumeration workhorse.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: tool-scanning
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
