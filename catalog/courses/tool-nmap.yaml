    - Default/safe NSE scripts
    - Exploits
    - Nothing
    answer: Default/safe NSE scripts
    competency: tool-scanning
    explanation: Default category.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Port state that usually means a firewall is dropping probes?
    answer: filtered
    competency: tool-scanning
    explanation: filtered.
    points: 10
    hints: []
  difficulty: easy
  passing_score: 70
  description: ''
