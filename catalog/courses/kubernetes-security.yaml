id: kubernetes-security
title: Kubernetes Security
description: Cluster architecture, RBAC and network policies.
difficulty: hard
category: container
specialization: cloud
estimated_minutes: 95
objectives:
- Understand cluster and rbac
- Understand network policies
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- docker-security
competency_prereqs: []
tags:
- container
- cloud
references: []
os_requirements: []
lab_id: container-security-lab
version: 1.0.0
lessons:
- title: Cluster and RBAC
  difficulty: hard
  minutes: 20
  competency: kubernetes-security
  body: Kubernetes schedules containers across nodes. The API server is the control plane's gateway; RBAC
    governs who can do what. Over-broad roles (cluster-admin everywhere) are a top risk. Grant least-privilege
    roles scoped to namespaces.
  exercises:
  - kind: mcq
    prompt: 'K8s authorisation is governed by:'
    choices:
    - DNS
    - RBAC
    - TLS only
    - cgroups
    answer: RBAC
    competency: kubernetes-security
    explanation: RBAC controls actions.
    points: 10
    hints: []
  hints:
  - text: Scope roles to namespaces; avoid cluster-admin.
  walkthrough: []
- title: Network policies
  difficulty: hard
  minutes: 15
  competency: network-policies
  body: By default pods can talk freely. NetworkPolicies implement micro-segmentation, allowing only required
    flows between workloads — the Kubernetes expression of least privilege and network segmentation.
  exercises:
  - kind: short_answer
    prompt: 'K8s object for pod-to-pod micro-segmentation: Network___.'
    answer: Policy
    competency: network-policies
    explanation: NetworkPolicy.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Inspect the container's full trust boundary
  difficulty: intermediate
  minutes: 20
  competency: kubernetes-security
  body: 'Review the image source and digest, user identity, capabilities, mounts, secrets, network attachments,
    and exposed ports. A container shares the host kernel, so a root process, privileged mode, or writable
    host mount can expand impact beyond the container. Check what the workload actually needs instead
    of assuming the image''s defaults are safe.


    Use the methods from **Kubernetes Security** to work this checklist:


    - Understand cluster and rbac

    - Understand network policies


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: Which principle should guide container capabilities and privileges?
    choices:
    - Least privilege
    - Privileged by default
    - Shared root access
    - Disable logging
    answer: Least privilege
    competency: kubernetes-security
    explanation: Containers should receive only the privileges and capabilities the workload requires.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Reduce runtime privilege and verify isolation
  difficulty: intermediate
  minutes: 20
  competency: kubernetes-security
  body: 'Apply one restriction at a time: run as a non-root user, drop unused capabilities, make the filesystem
    read-only where possible, limit resources, and use narrow network policy. Verify the workload still
    functions, then inspect the effective runtime configuration rather than relying only on a deployment
    file. Record the image digest and policy evidence for repeatability.


    ## Apply this to Kubernetes Security


    Cluster architecture, RBAC and network policies.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: kubernetes-security
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Kubernetes Security Assessment
  questions:
  - kind: mcq
    prompt: 'Over-broad K8s roles are a risk because:'
    choices:
    - They slow pods
    - They grant excessive control
    - They use RAM
    - They break DNS
    answer: They grant excessive control
    competency: kubernetes-security
    explanation: Least privilege applies.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Default pod networking is ___ (open/closed)?
    answer: open
    competency: network-policies
    explanation: Open until policies restrict it.
    points: 10
    hints: []
  difficulty: hard
  passing_score: 70
  description: ''
