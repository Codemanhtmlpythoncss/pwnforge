id: sql-injection-labs
title: SQL Injection in Isolated Labs
description: Recognise, verify and remediate SQL injection in a safe lab.
difficulty: intermediate
category: web-security
specialization: web
estimated_minutes: 95
objectives:
- Understand recognising injection
- Understand verifying the remediation
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- sql-fundamentals
- web-application-security
competency_prereqs:
- sql-injection
tags:
- web
references: []
os_requirements: []
lab_id: web-security-lab
version: 1.0.0
lessons:
- title: Recognising injection
  difficulty: intermediate
  minutes: 20
  competency: sql-injection
  body: 'SQL injection occurs when untrusted input alters a query''s structure. Symptoms a defender looks
    for: error messages revealing SQL, behaviour that changes with quote characters, and unexpected data
    returned. In the lab you will observe how a vulnerable endpoint differs from a parameterised one,
    then apply the fix and confirm the behaviour is gone.'
  exercises:
  - kind: mcq
    prompt: 'A reliable fix once SQLi is found:'
    choices:
    - Blocklist the word SELECT
    - Convert to parameterised queries
    - Lowercase input
    - Add a CAPTCHA
    answer: Convert to parameterised queries
    competency: sql-injection
    explanation: Parameterisation removes the class of bug.
    points: 10
    hints: []
  hints:
  - text: Compare the vulnerable and fixed endpoints side by side.
  walkthrough: []
- title: Verifying the remediation
  difficulty: intermediate
  minutes: 15
  competency: vuln-remediation
  body: Finding a bug is half the job; proving it is fixed is the other half. After converting to prepared
    statements, re-test the same inputs and confirm the query structure cannot change. Document the before/after
    for the report — a core professional skill.
  exercises:
  - kind: short_answer
    prompt: Prepared statements separate code from ___.
    answer: data
    competency: sql-injection
    explanation: They separate SQL code from data.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Trace a browser request through the application
  difficulty: intermediate
  minutes: 20
  competency: sql-injection
  body: 'Follow an input from the request into application logic, storage, and the response. Identify
    the trust boundary at each step. Authentication answers who the user is; authorization decides what
    that user may do. For output, note whether data enters HTML text, an attribute, JavaScript, or a URL,
    because each context needs the correct encoding. For database operations, parameterize values rather
    than joining user text into query strings.


    Use the methods from **SQL Injection in Isolated Labs** to work this checklist:


    - Understand recognising injection

    - Understand verifying the remediation


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What should be used for values in a database query?
    choices:
    - Parameterized queries
    - String concatenation
    - A hidden form field
    - Client-side validation alone
    answer: Parameterized queries
    competency: sql-injection
    explanation: Parameterized queries keep user-controlled values separate from SQL syntax.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Verify fixes at the right context
  difficulty: intermediate
  minutes: 20
  competency: sql-injection
  body: 'Use a harmless test value in an authorised environment and record the request, response, and
    affected account. Change one control, then repeat the same request and confirm the unsafe result is
    gone. Also verify normal input still succeeds and access checks apply to direct API requests, not
    only hidden or disabled buttons. Document the exact affected route and the evidence supporting the
    result.


    ## Apply this to SQL Injection in Isolated Labs


    Recognise, verify and remediate SQL injection in a safe lab.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: sql-injection
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: SQL Injection in Isolated Labs Assessment
  questions:
  - kind: mcq
    prompt: 'SQLi root cause:'
    choices:
    - Weak CPU
    - Input altering query structure
    - Large tables
    - UDP
    answer: Input altering query structure
    competency: sql-injection
    explanation: Input changing the query is the cause.
    points: 10
    hints: []
  - kind: short_answer
    prompt: What you produce to show a fix works (before/___)?
    answer: after
    competency: vuln-remediation
    explanation: Before/after evidence.
    points: 10
    hints: []
  difficulty: intermediate
  passing_score: 70
  description: ''
