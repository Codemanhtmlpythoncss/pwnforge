id: osint-techniques
title: OSINT Investigation Techniques
description: 'Practical, source-safe techniques: advanced search, metadata, geolocation basics, and the
  discipline of verification.'
difficulty: intermediate
category: osint
specialization: osint
estimated_minutes: 115
objectives:
- Understand advanced search & pivoting
- Understand metadata and media
- Understand verification & corroboration
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- osint-fundamentals
competency_prereqs:
- osint-fundamentals
tags:
- osint
- recon
references: []
os_requirements: []
lab_id: osint-investigation-lab
version: 1.0.0
lessons:
- title: Advanced search & pivoting
  difficulty: intermediate
  minutes: 20
  competency: osint-techniques
  body: 'Search operators focus results: site/domain filters, exact phrases, file-type filters and date
    ranges turn a vague query into a precise one. *Pivoting* means using one confirmed fact (a domain,
    a handle, an organisation) to find related public records — then confirming each new fact independently
    rather than assuming the link.'
  exercises:
  - kind: short_answer
    prompt: Using one confirmed fact to find related public data is called ___.
    answer: pivoting
    competency: osint-techniques
    explanation: Pivoting expands from confirmed facts.
    points: 10
    hints: []
  hints:
  - text: Narrow first (operators), then pivot from confirmed facts.
  walkthrough: []
- title: Metadata and media
  difficulty: intermediate
  minutes: 15
  competency: osint-techniques
  body: Public files and images can carry metadata (e.g. EXIF) such as timestamps or camera details. In
    the sandbox you examine provided sample files with tools like `exiftool` to understand what metadata
    reveals — and, defensively, why publishers should strip it. Treat any personal data found under the
    same ethics and minimisation rules.
  exercises:
  - kind: mcq
    prompt: 'Image metadata that may include timestamps is called:'
    choices:
    - DNS
    - EXIF
    - TLS
    - CSP
    answer: EXIF
    competency: osint-techniques
    explanation: EXIF metadata can accompany images.
    points: 10
    hints: []
  hints: []
  walkthrough:
  - title: Inspect the sample
    detail: Run `exiftool sample.jpg` on the provided file.
  - title: Read the fields
    detail: Note any timestamp/device fields present.
  - title: Draw the defensive lesson
    detail: Note why publishers strip metadata.
- title: Verification & corroboration
  difficulty: intermediate
  minutes: 20
  competency: osint-corroboration
  body: A single source is a lead, not a fact. Corroborate with **independent** sources, assess each source's
    reliability and recency, and record the provenance of every claim. State confidence explicitly and
    distinguish what you *know* from what you *infer*. Unverified findings must be labelled as such in
    the report.
  exercises:
  - kind: short_answer
    prompt: A single unverified source is a ___, not a fact.
    answer: lead
    competency: osint-corroboration
    explanation: Corroborate before asserting.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Plan a bounded public-source investigation
  difficulty: intermediate
  minutes: 20
  competency: osint-techniques
  body: 'Define the question, subject, timeframe, lawful basis, and collection limits before searching.
    Prefer primary sources and retain the exact URL, collection time, and relevant excerpt. Keep personal
    data to the minimum needed. A search result snippet is a lead; open and assess the source before treating
    it as evidence.


    Use the methods from **OSINT Investigation Techniques** to work this checklist:


    - Understand advanced search & pivoting

    - Understand metadata and media

    - Understand verification & corroboration


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: Which fields make a public-source observation auditable?
    choices:
    - Source, collection time, and confidence
    - Colour, font, and page size
    - Search order only
    - The analyst's guess
    answer: Source, collection time, and confidence
    competency: osint-techniques
    explanation: Provenance, time, and confidence help another analyst assess an OSINT observation.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Corroborate claims and write with confidence
  difficulty: intermediate
  minutes: 20
  competency: osint-techniques
  body: 'Corroborate important claims with independent sources and check whether they refer to the same
    person, organisation, or time period. Record confidence and contradictory evidence. Separate fact
    from inference in the report, explain source limitations, and remove sensitive details that do not
    support the stated purpose.


    ## Apply this to OSINT Investigation Techniques


    Practical, source-safe techniques: advanced search, metadata, geolocation basics, and the discipline
    of verification.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: osint-techniques
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: OSINT Investigation Techniques Assessment
  questions:
  - kind: mcq
    prompt: 'Pivoting should expand from:'
    choices:
    - Any guess
    - Confirmed facts
    - Private data
    - Assumptions
    answer: Confirmed facts
    competency: osint-techniques
    explanation: Pivot from confirmed facts, re-verifying each step.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Image metadata standard mentioned (acronym)?
    answer: EXIF
    competency: osint-techniques
    explanation: EXIF.
    points: 10
    hints: []
  - kind: mcq
    prompt: 'Before asserting a finding you must:'
    choices:
    - Publish it
    - Corroborate independently
    - Delete sources
    - Assume it
    answer: Corroborate independently
    competency: osint-corroboration
    explanation: Independent corroboration first.
    points: 10
    hints: []
  difficulty: intermediate
  passing_score: 70
  description: ''
