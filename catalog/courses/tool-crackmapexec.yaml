lessons:
- title: Sweeping with nxc/cme
  difficulty: advanced
  minutes: 20
  competency: tool-ad-tooling
  body: 'NetExec (the maintained successor to CrackMapExec) checks many hosts for access, shares and config.


    ```

    nxc smb 10.200.0.0/24

    nxc smb 10.200.0.10 -u user -p pass --shares

    nxc smb 10.200.0.10 -u user -p pass --users

    ```

    It quickly shows where a credential works — invaluable both for assessment and for spotting over-broad
    access to remediate.


    > Only run these tools against systems you own or are explicitly authorised to test — the Pwnforge
    labs are built for exactly this. Unauthorised scanning or access is unethical and usually unlawful.'
  exercises:
  - kind: short_answer
    prompt: Maintained successor to CrackMapExec (command)?
    answer: nxc
    competency: tool-ad-tooling
    explanation: NetExec (`nxc`).
    points: 10
    hints: []
  hints:
  - text: '`--shares` and `--users` are common enumeration flags.'
  walkthrough: []
