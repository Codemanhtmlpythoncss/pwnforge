id: windows-administration
title: Windows Administration
description: Manage Windows services, policies and the event log.
difficulty: easy
category: windows
specialization: infrastructure
estimated_minutes: 90
objectives:
- Understand services and scheduled tasks
- Understand event logs and auditing
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- windows-fundamentals
competency_prereqs: []
tags:
- windows
references: []
os_requirements: []
lab_id: null
version: 1.0.0
lessons:
- title: Services and scheduled tasks
  difficulty: easy
  minutes: 15
  competency: windows-administration
  body: Services run background functionality; scheduled tasks run on triggers. Both are common persistence
    and misconfiguration points. Review service accounts and binary paths (unquoted service paths are
    a classic issue). Use `services.msc`, `sc query`, and `Get-ScheduledTask`.
  exercises:
  - kind: mcq
    prompt: 'An unquoted service path is a risk because:'
    choices:
    - It is slower
    - Windows may execute an unintended binary
    - It uses more RAM
    - It breaks logging
    answer: Windows may execute an unintended binary
    competency: windows-privesc
    explanation: Spaces in unquoted paths can redirect execution.
    points: 10
    hints: []
  hints:
  - text: Look for service binaries in paths with spaces and no quotes.
  walkthrough: []
- title: Event logs and auditing
  difficulty: easy
  minutes: 15
  competency: windows-administration
  body: Windows Event Log records security-relevant events (logons 4624/4625, privilege use, process creation
    4688). Enabling and forwarding these logs underpins detection. `Get-WinEvent` queries them. Auditing
    is only useful if logs are collected centrally and reviewed.
  exercises:
  - kind: short_answer
    prompt: Event ID for a successful logon?
    answer: '4624'
    competency: log-analysis
    explanation: 4624 is a successful logon.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Inventory Windows services and identities
  difficulty: intermediate
  minutes: 20
  competency: windows-administration
  body: 'Use `Get-Service` to inventory service state, `Get-NetTCPConnection` or `netstat -ano` to map
    listeners, and `Get-LocalGroupMember` to review local group membership. Record the service, account,
    startup mode, port, and process identifier together. In a domain environment, distinguish local configuration
    from centrally applied policy; a local change may be overwritten by Group Policy.


    Use the methods from **Windows Administration** to work this checklist:


    - Understand services and scheduled tasks

    - Understand event logs and auditing


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: Which PowerShell command inventories Windows services?
    choices:
    - Get-Service
    - Get-ProcessRoute
    - Get-FileHash
    - Get-DnsClient
    answer: Get-Service
    competency: windows-administration
    explanation: '`Get-Service` reports installed service names and their current states.'
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Verify policy and event evidence
  difficulty: intermediate
  minutes: 20
  competency: windows-administration
  body: 'Before changing a service or permission, record its current value and the expected business function.
    Apply the smallest policy change, then verify both the setting and the service''s behaviour. Use the
    relevant Windows event channel to confirm the change or investigate a failure. Preserve event time,
    host, account, and event identifier so another analyst can reproduce your conclusion.


    ## Apply this to Windows Administration


    Manage Windows services, policies and the event log.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: windows-administration
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Windows Administration Assessment
  questions:
  - kind: short_answer
    prompt: Event ID for a failed logon?
    answer: '4625'
    competency: log-analysis
    explanation: 4625 indicates a failed logon.
    points: 10
    hints: []
  - kind: mcq
    prompt: 'Scheduled tasks are often abused for:'
    choices:
    - Faster boot
    - Persistence
    - Disk cleanup
    - Theming
    answer: Persistence
    competency: detection-engineering
    explanation: Attackers use scheduled tasks to persist.
    points: 10
    hints: []
  difficulty: easy
  passing_score: 70
  description: ''
