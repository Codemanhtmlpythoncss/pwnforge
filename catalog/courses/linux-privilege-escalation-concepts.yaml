id: linux-privilege-escalation-concepts
title: Linux Privilege-Escalation Concepts
description: Understand how Linux privilege boundaries are weakened and hardened.
difficulty: hard
category: methodology
specialization: pentest
estimated_minutes: 100
objectives:
- Understand where boundaries break
- Understand hardening against it
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- linux-administration
- service-enumeration
competency_prereqs:
- linux-administration
tags:
- methodology
references: []
os_requirements: []
lab_id: linux-admin-lab
version: 1.0.0
lessons:
- title: Where boundaries break
  difficulty: hard
  minutes: 20
  competency: linux-privesc
  body: 'Privilege escalation exploits a misconfiguration that lets a low-privilege user gain more rights:
    over-permissive sudo rules, SUID binaries used unsafely, writable paths used by root services, and
    exposed credentials. The defensive goal is to enumerate these conditions and remove them — least privilege,
    minimal SUID, careful sudoers.'
  exercises:
  - kind: mcq
    prompt: Which is a common Linux privesc condition?
    choices:
    - Read-only /etc
    - Over-permissive sudo rules
    - Disabled services
    - A firewall
    answer: Over-permissive sudo rules
    competency: linux-privesc
    explanation: Broad sudo rules are a classic path.
    points: 10
    hints: []
  hints:
  - text: Enumerate sudo, SUID and writable root-run paths.
  walkthrough: []
- title: Hardening against it
  difficulty: hard
  minutes: 20
  competency: infrastructure-hardening
  body: 'Remediation: audit `sudo -l` capability, review SUID/SGID binaries, ensure service files and
    their directories are not writable by non-root, rotate and protect credentials, and keep the kernel/packages
    patched. Verify each fix.'
  exercises:
  - kind: short_answer
    prompt: 'Principle to apply to limit privesc: least ___.'
    answer: privilege
    competency: linux-privesc
    explanation: Least privilege limits escalation.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Build a Linux host inventory
  difficulty: intermediate
  minutes: 20
  competency: linux-privesc
  body: 'Work from identity to processes to network exposure. Use `id` and `groups` to understand the
    current account, `ps` to inspect running processes, `systemctl --type=service --state=running` (or
    `rc-service -l` on Alpine) to inspect services, and `ss -lntup` to map listening sockets to processes.
    Check important files with `stat` or `ls -l`; inspect sudo rules only with authorisation. Save the
    command and the relevant output as evidence.


    Use the methods from **Linux Privilege-Escalation Concepts** to work this checklist:


    - Understand where boundaries break

    - Understand hardening against it


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: Which command is the modern default for listing listening sockets?
    choices:
    - ss
    - chmod
    - grep
    - whoami
    answer: ss
    competency: linux-privesc
    explanation: '`ss` reports socket state and can include listening ports and process information.'
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Trace permissions and service exposure
  difficulty: intermediate
  minutes: 20
  competency: linux-privesc
  body: 'For each finding, state the observed owner, group, mode, process, service, or socket before recommending
    a change. Compare the access that is configured with the access the service needs. Apply one least-privilege
    correction at a time, then repeat the exact observation that exposed the issue. Check the service
    still works, read its journal for errors, and note any remaining access that is intentional.


    ## Apply this to Linux Privilege-Escalation Concepts


    Understand how Linux privilege boundaries are weakened and hardened.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: linux-privesc
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Linux Privilege-Escalation Concepts Assessment
  questions:
  - kind: mcq
    prompt: 'SUID binaries are risky when they:'
    choices:
    - Are small
    - Can be abused to run as owner (often root)
    - Use colour
    - Log a lot
    answer: Can be abused to run as owner (often root)
    competency: linux-privesc
    explanation: Unsafe SUID use runs as the file owner.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Core principle against privesc?
    answer: least privilege
    competency: linux-privesc
    explanation: Least privilege.
    points: 10
    hints: []
  difficulty: hard
  passing_score: 70
  description: ''
