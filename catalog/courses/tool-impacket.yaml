lessons:
- title: The Impacket example scripts
  difficulty: advanced
  minutes: 20
  competency: tool-ad-tooling
  body: 'Impacket ships example scripts that implement Windows protocols.


    ```

    impacket-smbclient lab/user:pass@10.200.0.10

    impacket-GetUserSPNs lab/user:pass -dc-ip 10.200.0.10

    impacket-secretsdump lab/user:pass@10.200.0.10

    ```

    They''re the backbone of AD testing (and of understanding attacks so you can detect them). Use only
    against your owned lab domain.


    > Only run these tools against systems you own or are explicitly authorised to test — the Pwnforge
    labs are built for exactly this. Unauthorised scanning or access is unethical and usually unlawful.'
  exercises:
  - kind: mcq
    prompt: 'Impacket scripts primarily implement:'
    choices:
    - Web scanning
    - Windows protocols (SMB/RPC/Kerberos)
    - Password cracking
    - Packet capture
    answer: Windows protocols (SMB/RPC/Kerberos)
    competency: tool-ad-tooling
    explanation: They speak Windows protocols.
    points: 10
    hints: []
  hints:
  - text: GetUserSPNs relates to Kerberoasting; secretsdump to credential material.
  walkthrough: []
