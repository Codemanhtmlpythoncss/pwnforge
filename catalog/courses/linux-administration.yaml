id: linux-administration
title: Linux Administration
description: Manage services, users, packages and systemd on Debian systems.
difficulty: easy
category: linux
specialization: linux
estimated_minutes: 105
objectives:
- Understand users and groups
- Understand packages and updates
- Understand systemd services
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- linux-fundamentals
competency_prereqs:
- linux-fundamentals
tags:
- linux
references: []
os_requirements: []
lab_id: linux-admin-lab
version: 1.0.0
lessons:
- title: Users and groups
  difficulty: easy
  minutes: 15
  competency: linux-administration
  body: 'User accounts live in `/etc/passwd`; group membership in `/etc/group`. Add users with `useradd`/`adduser`,
    grant sudo via group membership (e.g. `sudo`), and review `/etc/sudoers` carefully: an over-broad
    sudo rule is a frequent privilege-escalation path. Audit with `getent passwd` and `id <user>`.'
  exercises:
  - kind: command
    prompt: Command to show a user's uid, gid and groups?
    answer: id
    competency: linux-administration
    explanation: '`id <user>` shows identity info.'
    points: 10
    hints: []
  hints:
  - text: '`/etc/sudoers` controls elevated access — review it with `visudo`.'
  walkthrough: []
- title: Packages and updates
  difficulty: easy
  minutes: 15
  competency: linux-administration
  body: Debian uses APT. `apt update` refreshes the package index; `apt upgrade` applies updates; `apt
    install <pkg>` adds software. Keeping packages patched is one of the highest-value security controls.
    Unattended-upgrades can automate security patches. Know which version is installed with `dpkg -l <pkg>`.
  exercises:
  - kind: command
    prompt: APT subcommand to refresh the package index?
    answer: update
    competency: linux-administration
    explanation: '`apt update` refreshes the index.'
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: systemd services
  difficulty: easy
  minutes: 15
  competency: linux-administration
  body: systemd manages services as *units*. `systemctl start/stop/enable <unit>` controls them; `systemctl
    status <unit>` and `journalctl -u <unit>` show state and logs. Disabling unused services reduces attack
    surface — a core hardening step.
  exercises:
  - kind: command
    prompt: Command to view logs for the unit ssh?
    answer: journalctl -u ssh
    competency: log-analysis
    explanation: '`journalctl -u <unit>` shows a unit''s logs.'
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Build a Linux host inventory
  difficulty: intermediate
  minutes: 20
  competency: linux-administration
  body: 'Work from identity to processes to network exposure. Use `id` and `groups` to understand the
    current account, `ps` to inspect running processes, `systemctl --type=service --state=running` (or
    `rc-service -l` on Alpine) to inspect services, and `ss -lntup` to map listening sockets to processes.
    Check important files with `stat` or `ls -l`; inspect sudo rules only with authorisation. Save the
    command and the relevant output as evidence.


    Use the methods from **Linux Administration** to work this checklist:


    - Understand users and groups

    - Understand packages and updates

    - Understand systemd services


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: Which command is the modern default for listing listening sockets?
    choices:
    - ss
    - chmod
    - grep
    - whoami
    answer: ss
    competency: linux-administration
    explanation: '`ss` reports socket state and can include listening ports and process information.'
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Trace permissions and service exposure
  difficulty: intermediate
  minutes: 20
  competency: linux-administration
  body: 'For each finding, state the observed owner, group, mode, process, service, or socket before recommending
    a change. Compare the access that is configured with the access the service needs. Apply one least-privilege
    correction at a time, then repeat the exact observation that exposed the issue. Check the service
    still works, read its journal for errors, and note any remaining access that is intentional.


    ## Apply this to Linux Administration


    Manage services, users, packages and systemd on Debian systems.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: linux-administration
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Linux Administration Assessment
  questions:
  - kind: mcq
    prompt: Which file defines sudo privileges?
    choices:
    - /etc/passwd
    - /etc/sudoers
    - /etc/group
    - /etc/hosts
    answer: /etc/sudoers
    competency: linux-administration
    explanation: '`/etc/sudoers` governs sudo access.'
    points: 10
    hints: []
  - kind: command
    prompt: Enable a service at boot with systemctl ___ <unit>
    answer: enable
    competency: linux-administration
    explanation: '`systemctl enable` sets a unit to start at boot.'
    points: 10
    hints: []
  - kind: mcq
    prompt: Highest-value routine security control here?
    choices:
    - Changing the MOTD
    - Applying patches
    - Renaming root
    - Disabling colour
    answer: Applying patches
    competency: infrastructure-hardening
    explanation: Patching closes known holes.
    points: 10
    hints: []
  difficulty: easy
  passing_score: 70
  description: ''
