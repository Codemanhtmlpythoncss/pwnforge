id: api-security
title: API Security
description: Securing REST and GraphQL interfaces.
difficulty: hard
category: web-security
specialization: web
estimated_minutes: 95
objectives:
- Understand api authentication and authorisation
- Understand rate limiting and schema discipline
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- access-control-course
- authentication-security
competency_prereqs: []
tags:
- web
references: []
os_requirements: []
lab_id: null
version: 1.0.0
lessons:
- title: API authentication and authorisation
  difficulty: hard
  minutes: 20
  competency: api-security
  body: 'APIs need robust auth: tokens (e.g. OAuth2/JWT) validated on every request, with authorisation
    checks per object and per action. Common failures: accepting unverified tokens, missing object-level
    checks (the API equivalent of IDOR), and excessive data exposure where the API returns more than the
    client needs.'
  exercises:
  - kind: mcq
    prompt: '''Broken object level authorization'' is essentially:'
    choices:
    - A DNS bug
    - IDOR for APIs
    - A TLS bug
    - A caching bug
    answer: IDOR for APIs
    competency: api-security
    explanation: BOLA is object-level access control failure in APIs.
    points: 10
    hints: []
  hints:
  - text: Check every object on every request.
  walkthrough: []
- title: Rate limiting and schema discipline
  difficulty: hard
  minutes: 15
  competency: api-security
  body: APIs should enforce rate limits, validate request schemas strictly, and avoid returning internal
    fields. For GraphQL, limit query depth/complexity to prevent resource exhaustion. Document and version
    the API clearly.
  exercises:
  - kind: short_answer
    prompt: Control that prevents API abuse by volume?
    answer: rate limiting
    competency: api-security
    explanation: Rate limiting caps request volume.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Trace a browser request through the application
  difficulty: intermediate
  minutes: 20
  competency: api-security
  body: 'Follow an input from the request into application logic, storage, and the response. Identify
    the trust boundary at each step. Authentication answers who the user is; authorization decides what
    that user may do. For output, note whether data enters HTML text, an attribute, JavaScript, or a URL,
    because each context needs the correct encoding. For database operations, parameterize values rather
    than joining user text into query strings.


    Use the methods from **API Security** to work this checklist:


    - Understand api authentication and authorisation

    - Understand rate limiting and schema discipline


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What should be used for values in a database query?
    choices:
    - Parameterized queries
    - String concatenation
    - A hidden form field
    - Client-side validation alone
    answer: Parameterized queries
    competency: api-security
    explanation: Parameterized queries keep user-controlled values separate from SQL syntax.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Verify fixes at the right context
  difficulty: intermediate
  minutes: 20
  competency: api-security
  body: 'Use a harmless test value in an authorised environment and record the request, response, and
    affected account. Change one control, then repeat the same request and confirm the unsafe result is
    gone. Also verify normal input still succeeds and access checks apply to direct API requests, not
    only hidden or disabled buttons. Document the exact affected route and the evidence supporting the
    result.


    ## Apply this to API Security


    Securing REST and GraphQL interfaces.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: api-security
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: API Security Assessment
  questions:
  - kind: mcq
    prompt: 'Excessive data exposure means the API:'
    choices:
    - Is too slow
    - Returns more than the client needs
    - Uses UDP
    - Lacks TLS
    answer: Returns more than the client needs
    competency: api-security
    explanation: Return only what is needed.
    points: 10
    hints: []
  - kind: short_answer
    prompt: API equivalent of IDOR (acronym)?
    answer: BOLA
    competency: api-security
    explanation: Broken Object Level Authorization.
    points: 10
    hints: []
  difficulty: hard
  passing_score: 70
  description: ''
