id: reconnaissance
title: Reconnaissance in Authorised Environments
description: Gather information about in-scope systems methodically.
difficulty: easy
category: methodology
specialization: pentest
estimated_minutes: 85
objectives:
- Understand passive vs active
- Understand building an asset inventory
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- networking-fundamentals
competency_prereqs: []
tags:
- methodology
references: []
os_requirements: []
lab_id: null
version: 1.0.0
lessons:
- title: Passive vs active
  difficulty: easy
  minutes: 15
  competency: reconnaissance
  body: Passive recon uses information already available without touching the target (public records,
    documentation). Active recon interacts with in-scope systems (resolving names, checking which services
    respond). Record everything you learn; reconnaissance must stay within the written scope.
  exercises:
  - kind: mcq
    prompt: 'Interacting directly with an in-scope host is:'
    choices:
    - Passive recon
    - Active recon
    - Reporting
    - Scoping
    answer: Active recon
    competency: reconnaissance
    explanation: Direct interaction is active.
    points: 10
    hints: []
  hints:
  - text: Passive = no interaction; active = interaction with in-scope assets.
  walkthrough: []
- title: Building an asset inventory
  difficulty: easy
  minutes: 10
  competency: reconnaissance
  body: 'Reconnaissance should produce an **asset inventory**: a structured record of the in-scope systems
    you discovered and the evidence about each one. For each asset, record its hostname or IP address,
    role if known, exposed ports and services, where and when you observed the information, and your confidence
    in it. For example: `web-01 | 10.10.10.20 | HTTPS on 443 | DNS lookup | observed today | high confidence`.
    This inventory is the map for later enumeration and prioritisation; it is not a claim that every listed
    system is vulnerable. Do not add systems outside the authorised scope.'
  exercises:
  - kind: mcq
    prompt: Which is a useful asset-inventory entry?
    choices:
    - An in-scope host's IP, observed services and evidence source
    - A guessed password for an unknown user
    - A system discovered outside the agreed scope
    - A vulnerability assumed without checking
    answer: An in-scope host's IP, observed services and evidence source
    competency: reconnaissance
    explanation: Record scoped systems and observed facts, with their evidence.
    points: 10
    hints: []
  hints:
  - text: Record observed facts about each in-scope system, not guesses.
  walkthrough: []
- title: Follow an evidence-led assessment workflow
  difficulty: intermediate
  minutes: 20
  competency: reconnaissance
  body: 'Begin with written authorisation, scope, exclusions, timing, and stop conditions. Discover only
    what the scope permits. For each possible issue, keep the raw observation, the affected asset, the
    method, and the timestamp. Validate impact with the least intrusive safe check that answers the question;
    do not turn a scanner warning into a confirmed vulnerability without evidence.


    Use the methods from **Reconnaissance in Authorised Environments** to work this checklist:


    - Understand passive vs active

    - Understand building an asset inventory


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What must be agreed before active testing begins?
    choices:
    - Written authorisation and scope
    - A public IP address
    - A scanner version
    - A vulnerability score
    answer: Written authorisation and scope
    competency: reconnaissance
    explanation: Active tests must stay within explicit authorisation, scope, and stop conditions.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Prioritise and communicate findings
  difficulty: intermediate
  minutes: 20
  competency: reconnaissance
  body: 'A useful finding names the affected asset and condition, explains realistic impact, and gives
    reproducible evidence. Rate severity using a stated method and explain assumptions. Recommend a fix
    that addresses the root cause, then define a retest that would demonstrate success. State limitations
    and out-of-scope observations separately so readers can distinguish confirmed results from leads.


    ## Apply this to Reconnaissance in Authorised Environments


    Gather information about in-scope systems methodically.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: reconnaissance
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Reconnaissance in Authorised Environments Assessment
  questions:
  - kind: mcq
    prompt: 'Reading public documentation about a target is:'
    choices:
    - Active recon
    - Passive recon
    - Exploitation
    - Reporting
    answer: Passive recon
    competency: reconnaissance
    explanation: No interaction = passive.
    points: 10
    hints: []
  - kind: short_answer
    prompt: The structured list of in-scope systems and their observed services is an asset ___.
    answer: inventory
    competency: reconnaissance
    explanation: Recon records scoped assets and verified details in an asset inventory.
    points: 10
    hints:
    - It is the organised record you use as a map for later enumeration.
  difficulty: easy
  passing_score: 70
  description: ''
