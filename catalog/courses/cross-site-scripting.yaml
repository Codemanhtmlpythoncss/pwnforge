id: cross-site-scripting
title: Cross-Site Scripting
description: How XSS arises in the browser and how output encoding prevents it.
difficulty: intermediate
category: web-security
specialization: web
estimated_minutes: 95
objectives:
- Understand reflected, stored and dom xss
- Understand content-security-policy
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- web-application-security
competency_prereqs:
- input-validation
tags:
- web
references: []
os_requirements: []
lab_id: web-security-lab
version: 1.0.0
lessons:
- title: Reflected, stored and DOM XSS
  difficulty: intermediate
  minutes: 20
  competency: xss
  body: 'XSS happens when an application places untrusted data into a page without correct encoding, so
    the browser treats it as script. Variants: reflected (from the request), stored (persisted server-side)
    and DOM-based (client-side sink). The defence is context-aware output encoding plus a Content-Security-Policy
    as defence in depth.'
  exercises:
  - kind: mcq
    prompt: 'Primary defence against XSS:'
    choices:
    - Input length limits
    - Context-aware output encoding
    - Faster rendering
    - UDP
    answer: Context-aware output encoding
    competency: xss
    explanation: Encoding for the output context neutralises markup.
    points: 10
    hints: []
  hints:
  - text: Encode for HTML, attribute, JS or URL context specifically.
  walkthrough: []
- title: Content-Security-Policy
  difficulty: intermediate
  minutes: 15
  competency: web-technologies
  body: A strong CSP restricts where scripts may load from and can block inline script, greatly reducing
    XSS impact even if an encoding bug slips through. It is defence in depth, not a substitute for correct
    encoding.
  exercises:
  - kind: short_answer
    prompt: Header that restricts script sources? (acronym)
    answer: CSP
    competency: web-technologies
    explanation: Content-Security-Policy.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Trace a browser request through the application
  difficulty: intermediate
  minutes: 20
  competency: xss
  body: 'Follow an input from the request into application logic, storage, and the response. Identify
    the trust boundary at each step. Authentication answers who the user is; authorization decides what
    that user may do. For output, note whether data enters HTML text, an attribute, JavaScript, or a URL,
    because each context needs the correct encoding. For database operations, parameterize values rather
    than joining user text into query strings.


    Use the methods from **Cross-Site Scripting** to work this checklist:


    - Understand reflected, stored and dom xss

    - Understand content-security-policy


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What should be used for values in a database query?
    choices:
    - Parameterized queries
    - String concatenation
    - A hidden form field
    - Client-side validation alone
    answer: Parameterized queries
    competency: xss
    explanation: Parameterized queries keep user-controlled values separate from SQL syntax.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Verify fixes at the right context
  difficulty: intermediate
  minutes: 20
  competency: xss
  body: 'Use a harmless test value in an authorised environment and record the request, response, and
    affected account. Change one control, then repeat the same request and confirm the unsafe result is
    gone. Also verify normal input still succeeds and access checks apply to direct API requests, not
    only hidden or disabled buttons. Document the exact affected route and the evidence supporting the
    result.


    ## Apply this to Cross-Site Scripting


    How XSS arises in the browser and how output encoding prevents it.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: xss
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Cross-Site Scripting Assessment
  questions:
  - kind: mcq
    prompt: 'Stored XSS differs from reflected because the payload is:'
    choices:
    - In the URL only
    - Persisted server-side
    - In a cookie
    - In DNS
    answer: Persisted server-side
    competency: xss
    explanation: Stored XSS is saved and served to others.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Defence in depth header for XSS? (acronym)
    answer: CSP
    competency: web-technologies
    explanation: CSP adds a second layer.
    points: 10
    hints: []
  difficulty: intermediate
  passing_score: 70
  description: ''
