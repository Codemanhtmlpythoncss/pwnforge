lessons:
- title: Formats, wordlists & rules
  difficulty: hard
  minutes: 20
  competency: tool-password-auditing
  body: 'John cracks captured hashes offline to measure strength.


    ```

    john --list=formats | head

    john --wordlist=rockyou.txt hashes.txt

    john --wordlist=rockyou.txt --rules hashes.txt

    john --show hashes.txt

    ```

    `--rules` mutates wordlist entries (capitalise, append digits). Use only on hashes from your own lab/accounts.
    The takeaway: long, unique passphrases and slow KDFs resist this.'
  exercises:
  - kind: command
    prompt: Show already-cracked results (john flag)?
    answer: --show
    competency: tool-password-auditing
    explanation: '`--show` lists cracked.'
    points: 10
    hints: []
  hints:
  - text: '`--rules` applies mutations; `rockyou.txt` is the classic list.'
  walkthrough: []
