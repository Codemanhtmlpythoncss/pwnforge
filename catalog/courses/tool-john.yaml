id: tool-john
title: 'John the Ripper: Password Auditing'
description: Audit password-hash strength offline from data you're authorised to test.
difficulty: hard
category: tools
specialization: pentest
estimated_minutes: 80
objectives:
- Understand formats, wordlists & rules
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- password-security-auditing
competency_prereqs: []
tags:
- tool
