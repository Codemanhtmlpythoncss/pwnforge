  - kind: short_answer
    prompt: 'Property that best resists cracking: length & ___.'
    answer: uniqueness
    competency: password-security
    explanation: Length + uniqueness.
    points: 10
    hints: []
  difficulty: hard
  passing_score: 70
  description: ''
