id: sql-fundamentals
title: SQL Fundamentals
description: Relational data, queries and why parameterisation matters.
difficulty: easy
category: web-security
specialization: web
estimated_minutes: 90
objectives:
- Understand select, where, join
- Understand parameterised queries
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- linux-fundamentals
competency_prereqs: []
tags:
- web
references: []
os_requirements: []
lab_id: null
version: 1.0.0
lessons:
- title: SELECT, WHERE, JOIN
  difficulty: easy
  minutes: 15
  competency: input-validation
  body: SQL queries relational tables. `SELECT col FROM users WHERE id = 5` returns rows; `JOIN` combines
    tables on a key. Understanding how queries are built is necessary to understand how *string-built*
    queries become injectable and how *parameterised* queries stay safe.
  exercises:
  - kind: mcq
    prompt: Which clause filters rows?
    choices:
    - SELECT
    - FROM
    - WHERE
    - ORDER BY
    answer: WHERE
    competency: input-validation
    explanation: WHERE filters rows.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Parameterised queries
  difficulty: easy
  minutes: 15
  competency: sql-injection
  body: A parameterised (prepared) query sends SQL and data separately, so user input can never change
    query structure. This is the definitive defence against SQL injection. Building queries by string
    concatenation is the anti-pattern that creates the vulnerability.
  exercises:
  - kind: mcq
    prompt: 'The definitive defence against SQL injection is:'
    choices:
    - Escaping quotes by hand
    - Parameterised queries
    - Hiding the DB
    - Rate limiting
    answer: Parameterised queries
    competency: sql-injection
    explanation: Prepared statements separate code from data.
    points: 10
    hints: []
  hints:
  - text: If input can change query structure, it is unsafe.
  walkthrough: []
- title: Trace a browser request through the application
  difficulty: intermediate
  minutes: 20
  competency: input-validation
  body: 'Follow an input from the request into application logic, storage, and the response. Identify
    the trust boundary at each step. Authentication answers who the user is; authorization decides what
    that user may do. For output, note whether data enters HTML text, an attribute, JavaScript, or a URL,
    because each context needs the correct encoding. For database operations, parameterize values rather
    than joining user text into query strings.


    Use the methods from **SQL Fundamentals** to work this checklist:


    - Understand select, where, join

    - Understand parameterised queries


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What should be used for values in a database query?
    choices:
    - Parameterized queries
    - String concatenation
    - A hidden form field
    - Client-side validation alone
    answer: Parameterized queries
    competency: input-validation
    explanation: Parameterized queries keep user-controlled values separate from SQL syntax.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Verify fixes at the right context
  difficulty: intermediate
  minutes: 20
  competency: input-validation
  body: 'Use a harmless test value in an authorised environment and record the request, response, and
    affected account. Change one control, then repeat the same request and confirm the unsafe result is
    gone. Also verify normal input still succeeds and access checks apply to direct API requests, not
    only hidden or disabled buttons. Document the exact affected route and the evidence supporting the
    result.


    ## Apply this to SQL Fundamentals


    Relational data, queries and why parameterisation matters.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: input-validation
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: SQL Fundamentals Assessment
  questions:
  - kind: short_answer
    prompt: Clause that filters rows in SQL?
    answer: WHERE
    competency: input-validation
    explanation: WHERE filters.
    points: 10
    hints: []
  - kind: mcq
    prompt: 'String-concatenated SQL is dangerous because input can:'
    choices:
    - Slow the DB
    - Alter query structure
    - Add indexes
    - Change charset
    answer: Alter query structure
    competency: sql-injection
    explanation: Concatenation lets input change the query.
    points: 10
    hints: []
  difficulty: easy
  passing_score: 70
  description: ''
