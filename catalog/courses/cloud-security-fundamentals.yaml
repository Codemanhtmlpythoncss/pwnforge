lessons:
- title: Shared responsibility & IAM
  difficulty: intermediate
  minutes: 20
  competency: cloud-fundamentals
  body: In the cloud, the provider secures the infrastructure and you secure your configuration, identities
    and data. Most cloud incidents stem from misconfiguration — public storage, over-privileged roles,
    exposed keys. IAM least privilege and secure defaults prevent the majority.
  exercises:
  - kind: mcq
    prompt: 'Most cloud incidents stem from:'
    choices:
    - Provider outages
    - Customer misconfiguration
    - Slow networks
    - Old CPUs
    answer: Customer misconfiguration
    competency: cloud-fundamentals
    explanation: Config errors dominate.
    points: 10
    hints: []
  hints:
  - text: You own identity, config and data.
  walkthrough: []
assessment:
  title: Cloud Security Fundamentals Assessment
  questions:
  - kind: short_answer
    prompt: Cloud security splits duties under the ___ responsibility model.
    answer: shared
    competency: cloud-fundamentals
    explanation: Shared responsibility.
    points: 10
    hints: []
  - kind: mcq
    prompt: 'A frequent cloud mistake:'
    choices:
    - Public storage buckets
    - Too much logging
    - Strong IAM
    - Encryption
    answer: Public storage buckets
    competency: cloud-fundamentals
    explanation: Public data stores leak often.
    points: 10
    hints: []
  difficulty: intermediate
  passing_score: 70
