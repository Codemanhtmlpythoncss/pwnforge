id: http-https
title: HTTP and HTTPS
description: Requests, responses, status codes, headers and transport security.
difficulty: beginner
category: web-security
specialization: web
estimated_minutes: 90
objectives:
- Understand anatomy of a request
- Understand security headers and https
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- web-technologies
competency_prereqs: []
tags:
- web
references: []
os_requirements: []
lab_id: null
version: 1.0.0
lessons:
- title: Anatomy of a request
  difficulty: beginner
  minutes: 15
  competency: http-fundamentals
  body: 'An HTTP request has a method (GET, POST, PUT, DELETE), a path, headers and an optional body.
    Responses carry a status code (2xx success, 3xx redirect, 4xx client error, 5xx server error) and
    headers. Methods have semantics: GET should not change state. Reading requests/responses precisely
    is essential.'
  exercises:
  - kind: mcq
    prompt: Which status class means client error?
    choices:
    - 2xx
    - 3xx
    - 4xx
    - 5xx
    answer: 4xx
    competency: http-fundamentals
    explanation: 4xx indicates client-side errors.
    points: 10
    hints: []
  hints:
  - text: GET is safe/idempotent; POST changes state.
  walkthrough: []
- title: Security headers and HTTPS
  difficulty: beginner
  minutes: 15
  competency: tls-certificates
  body: 'HTTPS (TLS) provides confidentiality and integrity in transit and authenticates the server via
    certificates. Response headers harden the app: `Content-Security-Policy`, `Strict-Transport-Security`,
    `X-Content-Type-Options`, and `X-Frame-Options`. These are cheap, high-value defensive controls.'
  exercises:
  - kind: short_answer
    prompt: Header that forces HTTPS for future visits? (acronym)
    answer: HSTS
    competency: tls-certificates
    explanation: Strict-Transport-Security is HSTS.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Trace a browser request through the application
  difficulty: intermediate
  minutes: 20
  competency: http-fundamentals
  body: 'Follow an input from the request into application logic, storage, and the response. Identify
    the trust boundary at each step. Authentication answers who the user is; authorization decides what
    that user may do. For output, note whether data enters HTML text, an attribute, JavaScript, or a URL,
    because each context needs the correct encoding. For database operations, parameterize values rather
    than joining user text into query strings.


    Use the methods from **HTTP and HTTPS** to work this checklist:


    - Understand anatomy of a request

    - Understand security headers and https


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What should be used for values in a database query?
    choices:
    - Parameterized queries
    - String concatenation
    - A hidden form field
    - Client-side validation alone
    answer: Parameterized queries
    competency: http-fundamentals
    explanation: Parameterized queries keep user-controlled values separate from SQL syntax.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Verify fixes at the right context
  difficulty: intermediate
  minutes: 20
  competency: http-fundamentals
  body: 'Use a harmless test value in an authorised environment and record the request, response, and
    affected account. Change one control, then repeat the same request and confirm the unsafe result is
    gone. Also verify normal input still succeeds and access checks apply to direct API requests, not
    only hidden or disabled buttons. Document the exact affected route and the evidence supporting the
    result.


    ## Apply this to HTTP and HTTPS


    Requests, responses, status codes, headers and transport security.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: http-fundamentals
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: HTTP and HTTPS Assessment
  questions:
  - kind: mcq
    prompt: '500-series status codes indicate:'
    choices:
    - Success
    - Redirect
    - Client error
    - Server error
    answer: Server error
    competency: http-fundamentals
    explanation: 5xx are server errors.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Header defining allowed script sources? (acronym)
    answer: CSP
    competency: web-technologies
    explanation: Content-Security-Policy is CSP.
    points: 10
    hints: []
  difficulty: beginner
  passing_score: 70
  description: ''
