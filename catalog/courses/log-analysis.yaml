id: log-analysis
title: Log Analysis
description: Read, filter and correlate logs to understand what happened.
difficulty: easy
category: defensive
specialization: defensive
estimated_minutes: 90
objectives:
- Understand where logs live and what they say
- Understand from logs to findings
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- linux-administration
competency_prereqs: []
tags:
- defensive
references: []
os_requirements: []
lab_id: defensive-monitoring-lab
version: 1.0.0
lessons:
- title: Where logs live and what they say
  difficulty: easy
  minutes: 15
  competency: log-analysis
  body: Linux logs under `/var/log` (auth.log, syslog, service logs); Windows uses the Event Log. Effective
    analysis means filtering to the relevant time window and events, then correlating across sources.
    A single log line rarely tells the story; the sequence does.
  exercises:
  - kind: mcq
    prompt: 'Correlating multiple logs helps because:'
    choices:
    - Logs are short
    - A sequence reveals what one line cannot
    - It saves disk
    - It is faster
    answer: A sequence reveals what one line cannot
    competency: log-analysis
    explanation: Correlation reconstructs events.
    points: 10
    hints: []
  hints:
  - text: Pin the time window first.
  walkthrough: []
- title: From logs to findings
  difficulty: easy
  minutes: 15
  competency: log-analysis
  body: 'Turn raw logs into findings: identify the actor, the action, the target and the outcome. Note
    gaps (missing logs are themselves a finding). Clear, time-ordered notes become the basis of an incident
    timeline.'
  exercises:
  - kind: short_answer
    prompt: Missing logs are themselves a ___.
    answer: finding
    competency: log-analysis
    explanation: Gaps matter.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Turn an alert into a testable question
  difficulty: intermediate
  minutes: 20
  competency: log-analysis
  body: 'Start from a specific hypothesis: which account or process did what, on which host, and when?
    Identify the log sources that can answer it, check time zones and clock offsets, and preserve the
    original event fields. Search a narrow time window first, then widen it only when evidence suggests
    a longer sequence. A missing event may reflect a logging gap, not proof that an action did not happen.


    Use the methods from **Log Analysis** to work this checklist:


    - Understand where logs live and what they say

    - Understand from logs to findings


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What time-ordered record helps reconstruct a sequence of events?
    choices:
    - Timeline
    - Asset tag
    - Firewall zone
    - Package manifest
    answer: Timeline
    competency: log-analysis
    explanation: A timeline aligns related observations chronologically across sources.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Build a timeline and validate a detection
  difficulty: intermediate
  minutes: 20
  competency: log-analysis
  body: 'Correlate independent sources and mark each statement as confirmed, inferred, or unknown. For
    a detection rule, write the behaviour it is meant to catch, the required fields, and known benign
    lookalikes. Test it against representative positive and negative events. Record precision limits and
    the response an analyst should take when it fires.


    ## Apply this to Log Analysis


    Read, filter and correlate logs to understand what happened.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: log-analysis
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Log Analysis Assessment
  questions:
  - kind: mcq
    prompt: 'Linux auth events are typically in:'
    choices:
    - /etc/passwd
    - /var/log/auth.log
    - /proc
    - /boot
    answer: /var/log/auth.log
    competency: log-analysis
    explanation: auth.log records authentication.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Correlate logs to build a ___ (time-ordered).
    answer: timeline
    competency: timeline-analysis
    explanation: Timelines order events.
    points: 10
    hints: []
  difficulty: easy
  passing_score: 70
  description: ''
