lab_id: null
version: 1.0.0
lessons:
- title: How Hydra works
  difficulty: hard
  minutes: 15
  competency: tool-password-auditing
  body: "Hydra tries username/password combinations against a service to measure resilience — run it only\
    \ against your own lab logins.\n\n```\nhydra -l admin -P rockyou.txt ssh://10.200.0.10\nhydra -L users.txt\
    \ -P pass.txt 10.200.0.10 http-post-form \\\n  '/login:user=^USER^&pass=^PASS^:Invalid'\n```\n`^USER^`/`^PASS^`\
    \ are placeholders; the trailing string is the failure marker. The defensive lesson: rate-limiting,\
    \ lockout and MFA make this ineffective.\n\n> Only run these tools against systems you own or are\
    \ explicitly authorised to test — the Pwnforge labs are built for exactly this. Unauthorised scanning\
    \ or access is unethical and usually unlawful."
  exercises:
  - kind: mcq
    prompt: What defeats online password guessing?
    choices:
    - Longer URLs
    - Rate-limiting/lockout/MFA
    - Faster CPU
    - More threads
    answer: Rate-limiting/lockout/MFA
    competency: tool-password-auditing
    explanation: Throttle, lock out, add MFA.
    points: 10
    hints: []
  hints:
  - text: '`-l` single user, `-L` user list; `-p`/`-P` likewise for passwords.'
  walkthrough: []
- title: Choose a tool for a specific question
  difficulty: intermediate
  minutes: 20
  competency: tool-password-auditing
  body: 'State the question you need answered before choosing a scanner, proxy, packet analyser, or password
    auditor. Confirm the target and limits, select the smallest useful option set, and save the complete
    output with tool version and timestamp. Understand what the tool measures and what it cannot see;
    a result may be incomplete because of filtering, authentication, or protocol behaviour.


    Use the methods from **Hydra: Authorised Authentication Testing** to work this checklist:


    - Understand how hydra works


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What should you do with a security tool's important result?
    choices:
    - Validate it with evidence
    - Assume it is always correct
    - Ignore its scope
    - Publish it without review
    answer: Validate it with evidence
    competency: tool-password-auditing
    explanation: Tools are aids to analysis; validate important output and preserve enough context to
      reproduce it.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Validate tool output and preserve context
  difficulty: intermediate
  minutes: 20
  competency: tool-password-auditing
  body: 'Verify important results with a second method or direct observation. For a finding, include the
    command or request, relevant output, target, and time. Avoid broad or high-rate options when a narrow
    check answers the question. Keep credentials and tokens out of saved transcripts, and stop if the
    tool behaves outside the authorised scope.


    ## Apply this to Hydra: Authorised Authentication Testing


    Test login resilience against guessing on systems you own.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: tool-password-auditing
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: 'Hydra: Authorised Authentication Testing Assessment'
  questions:
  - kind: mcq
    prompt: 'Best defence against Hydra-style guessing:'
    choices:
    - Hide the login
    - Rate-limit + lockout + MFA
    - Bigger wordlist
    - UDP
    answer: Rate-limit + lockout + MFA
    competency: tool-password-auditing
    explanation: Throttle + MFA.
    points: 10
    hints: []
  - kind: short_answer
    prompt: Hydra flag for a password list?
    answer: -P
    competency: tool-password-auditing
    explanation: '`-P`.'
    points: 10
    hints: []
  difficulty: hard
  passing_score: 70
  description: ''
