id: tool-hydra
title: 'Hydra: Authorised Authentication Testing'
description: Test login resilience against guessing on systems you own.
difficulty: hard
category: tools
specialization: pentest
estimated_minutes: 75
objectives:
- Understand how hydra works
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
