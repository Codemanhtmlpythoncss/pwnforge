id: network-monitoring
title: Network Monitoring
description: Observe network behaviour to spot anomalies.
difficulty: easy
category: defensive
specialization: defensive
estimated_minutes: 75
objectives:
- Understand baselines and anomalies
- Apply course concepts in a bounded, evidence-led workflow
- Verify results and explain limitations clearly
prerequisites:
- networking-fundamentals
competency_prereqs: []
tags:
- defensive
references: []
os_requirements: []
lab_id: defensive-monitoring-lab
version: 1.0.0
lessons:
- title: Baselines and anomalies
  difficulty: easy
  minutes: 15
  competency: network-monitoring
  body: You cannot spot the abnormal without knowing the normal. Monitoring builds a baseline of expected
    flows, volumes and destinations; deviations (new destinations, odd ports, volume spikes) become leads.
    Flow records and packet captures are the raw material.
  exercises:
  - kind: mcq
    prompt: 'Anomaly detection needs a:'
    choices:
    - Faster NIC
    - Baseline of normal
    - Bigger disk
    - New cable
    answer: Baseline of normal
    competency: network-monitoring
    explanation: Baselines define normal.
    points: 10
    hints: []
  hints:
  - text: Normal first, then deviations.
  walkthrough: []
- title: Turn an alert into a testable question
  difficulty: intermediate
  minutes: 20
  competency: network-monitoring
  body: 'Start from a specific hypothesis: which account or process did what, on which host, and when?
    Identify the log sources that can answer it, check time zones and clock offsets, and preserve the
    original event fields. Search a narrow time window first, then widen it only when evidence suggests
    a longer sequence. A missing event may reflect a logging gap, not proof that an action did not happen.


    Use the methods from **Network Monitoring** to work this checklist:


    - Understand baselines and anomalies


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What time-ordered record helps reconstruct a sequence of events?
    choices:
    - Timeline
    - Asset tag
    - Firewall zone
    - Package manifest
    answer: Timeline
    competency: network-monitoring
    explanation: A timeline aligns related observations chronologically across sources.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Build a timeline and validate a detection
  difficulty: intermediate
  minutes: 20
  competency: network-monitoring
  body: 'Correlate independent sources and mark each statement as confirmed, inferred, or unknown. For
    a detection rule, write the behaviour it is meant to catch, the required fields, and known benign
    lookalikes. Test it against representative positive and negative events. Record precision limits and
    the response an analyst should take when it fires.


    ## Apply this to Network Monitoring


    Observe network behaviour to spot anomalies.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: network-monitoring
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Network Monitoring Assessment
  questions:
  - kind: short_answer
    prompt: Compare traffic against a ___ to find anomalies.
    answer: baseline
    competency: network-monitoring
    explanation: Baselines reveal anomalies.
    points: 10
    hints: []
  - kind: mcq
    prompt: 'A sudden spike to a new destination is:'
    choices:
    - Always fine
    - A lead to investigate
    - A patch
    - A backup
    answer: A lead to investigate
    competency: network-monitoring
    explanation: Investigate deviations.
    points: 10
    hints: []
  difficulty: easy
  passing_score: 70
  description: ''
