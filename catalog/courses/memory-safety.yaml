    points: 10
    hints: []
  - kind: mcq
    prompt: 'Durable fix for memory-safety bugs:'
    choices:
    - Bigger RAM
    - Memory-safe languages / bounds checks
    - Faster CPU
    - More threads
    answer: Memory-safe languages / bounds checks
    competency: memory-safety
    explanation: Prevent the class.
    points: 10
    hints: []
  difficulty: advanced
  passing_score: 70
