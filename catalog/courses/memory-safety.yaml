lessons:
- title: Classes and mitigations
  difficulty: advanced
  minutes: 20
  competency: memory-safety
  body: 'Memory-safety bugs (buffer overflows, use-after-free) arise in languages without automatic bounds/lifetime
    checks. Modern mitigations — ASLR, DEP/NX, stack canaries, and memory-safe languages — raise the bar.
    The durable fix is to prevent the bug class: bounds checking, safe APIs, and memory-safe languages
    where possible.'
  exercises:
  - kind: mcq
    prompt: 'A mitigation that randomises memory layout:'
    choices:
    - DEP
    - ASLR
    - Canary
    - NX
    answer: ASLR
    competency: memory-safety
    explanation: ASLR randomises addresses.
    points: 10
    hints: []
  hints:
  - text: The best fix removes the bug class entirely.
  walkthrough: []
- title: Triage a binary without executing it
  difficulty: intermediate
  minutes: 20
  competency: memory-safety
  body: 'Before analysis, record the sample''s source and calculate a hash. Use `file`, metadata tools,
    strings, and section/import listings to learn what the file appears to be. Treat embedded text as
    clues, not proof. Inspect control flow and dangerous API use only after the basic file format and
    architecture are known.


    Use the methods from **Memory Safety** to work this checklist:


    - Understand classes and mitigations


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: What is analysis of a binary without running it called?
    choices:
    - Static analysis
    - Dynamic analysis
    - Fuzzing
    - Packet capture
    answer: Static analysis
    competency: memory-safety
    explanation: Static analysis examines a file without executing it.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Analyse behaviour in a contained environment
  difficulty: intermediate
  minutes: 20
  competency: memory-safety
  body: 'If dynamic analysis is authorised, use a disposable snapshot with network access disabled or
    explicitly controlled. Observe process, file, registry, and network behaviour, then revert the snapshot.
    Compare observed behaviour with the static hypothesis and record differences. Never execute an unknown
    sample on a workstation that holds personal or production data.


    ## Apply this to Memory Safety


    Memory-safety vulnerability classes and modern mitigations.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: memory-safety
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
