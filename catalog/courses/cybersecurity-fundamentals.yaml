lessons:
- title: The CIA triad
  difficulty: beginner
  minutes: 15
  competency: security-terminology
  body: "Security is often framed around three properties:\n\n- **Confidentiality** — information is available\
    \ only to those authorised to\n  see it (e.g. encryption, access control).\n- **Integrity** — information\
    \ is accurate and unaltered except by authorised\n  actors (e.g. hashing, digital signatures, change\
    \ control).\n- **Availability** — systems and data are accessible when needed (e.g.\n  redundancy,\
    \ backups, capacity planning).\n\nMost security decisions trade these against each other and against\
    \ usability.\nA good analyst can name which property a control protects and what happens when\nit\
    \ fails."
  exercises:
  - kind: mcq
    prompt: A backup primarily protects which property?
    choices:
    - Confidentiality
    - Integrity
    - Availability
    - Non-repudiation
    answer: Availability
    competency: security-terminology
    explanation: Backups restore access after data loss — an availability control.
    points: 10
    hints: []
  hints:
  - text: Think about which property fails if the control is absent.
  walkthrough: []
- title: Threats, vulnerabilities and risk
  difficulty: beginner
  minutes: 15
  competency: security-terminology
  body: "Precise language matters:\n\n- A **vulnerability** is a weakness (a missing patch, a weak password\
    \ policy).\n- A **threat** is something that could exploit a vulnerability (a criminal\n  group, malware,\
    \ an insider error).\n- **Risk** combines likelihood and impact: *risk = likelihood × impact*.\n\n\
    Security work is risk management, not risk elimination. You cannot fix\neverything, so you prioritise:\
    \ which weaknesses, if exploited, cause the most\nharm and are most likely to be targeted?"
  exercises:
  - kind: short_answer
    prompt: 'Complete the equation: risk = likelihood × ____'
    answer: impact
    competency: security-terminology
    explanation: Risk is commonly modelled as likelihood multiplied by impact.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Defence in depth and least privilege
  difficulty: beginner
  minutes: 15
  competency: security-terminology
  body: "Two foundational principles:\n\n- **Defence in depth**: layer independent controls so that one\
    \ failure does not\n  cause a breach. A firewall, patched software, monitoring and least privilege\n\
    \  each cover each other's gaps.\n- **Least privilege**: give every user, process and service only\
    \ the access it\n  needs, for only as long as it needs it. This limits the blast radius of any\n \
    \ single compromise or mistake.\n\nYou will apply both repeatedly — when hardening a Linux host, segmenting\
    \ a\nnetwork, or designing an application's authorisation model."
  exercises: []
  hints: []
  walkthrough: []
- title: Turn security language into a risk statement
  difficulty: intermediate
  minutes: 20
  competency: security-terminology
  body: 'Describe a security problem by naming the asset, the threat or failure, the weakness that makes
    it possible, and the likely impact. Risk is not just a vulnerability name: likelihood and impact depend
    on exposure, existing controls, and the value of the asset. Keep facts separate from assumptions and
    state what evidence would change your estimate.


    Use the methods from **Cybersecurity Fundamentals** to work this checklist:


    - Explain the CIA triad

    - Describe threats, vulnerabilities and risk

    - Understand defence in depth and least privilege


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: Which pair is the basic basis for prioritising a risk?
    choices:
    - Likelihood and impact
    - Hostname and port
    - Age and file size
    - Username and shell
    answer: Likelihood and impact
    competency: security-terminology
    explanation: Risk prioritisation considers how likely an event is and how much harm it could cause.
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Choose a control and verify its effect
  difficulty: intermediate
  minutes: 20
  competency: security-terminology
  body: 'Choose a control that addresses the cause of the risk, not only its visible symptom. Define how
    you will verify the control before changing anything, then repeat the same check after the change.
    Record remaining risk and any trade-offs. A control is not proven effective merely because it was
    configured; demonstrate that the expected unsafe behaviour is prevented and that normal use still
    works.


    ## Apply this to Cybersecurity Fundamentals


    Core security concepts: the CIA triad, threats and risk, defence in depth, and the vocabulary you
    will use throughout Pwnforge.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: security-terminology
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Fundamentals Assessment
  questions:
  - kind: mcq
    prompt: Which principle limits the blast radius of a compromised account?
    choices:
    - Defence in depth
    - Least privilege
    - Availability
    - Fail-open
    answer: Least privilege
    competency: security-terminology
    explanation: Least privilege restricts what any single account can do.
    points: 10
    hints: []
  - kind: short_answer
    prompt: What combines likelihood and impact?
    answer: risk
    competency: security-terminology
    explanation: Risk = likelihood × impact.
    points: 10
    hints: []
  - kind: mcq
    prompt: 'Encryption of data at rest primarily protects:'
    choices:
    - Availability
    - Integrity
    - Confidentiality
    - Redundancy
    answer: Confidentiality
    competency: security-terminology
    explanation: Encryption keeps data readable only to authorised parties.
    points: 10
    hints: []
  difficulty: beginner
  passing_score: 70
  description: ''
