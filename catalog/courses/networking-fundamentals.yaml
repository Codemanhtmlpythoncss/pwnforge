version: 1.0.0
lessons:
- title: IP addressing and subnets
  difficulty: beginner
  minutes: 15
  competency: networking-fundamentals
  body: An IPv4 address (e.g. `10.0.5.23`) plus a subnet mask (`/24`) defines a host and the network it
    belongs to. A `/24` has 256 addresses (254 usable). Hosts on the same subnet talk directly; otherwise
    traffic goes via a gateway/router. Private ranges (`10/8`, `172.16/12`, `192.168/16`) are used inside
    networks like Pwnforge's isolated labs.
  exercises:
  - kind: short_answer
    prompt: How many usable hosts in a /24?
    answer: '254'
    competency: networking-fundamentals
    explanation: 256 total minus network and broadcast.
    points: 10
    hints: []
  hints:
  - text: Usable = 2^(32-prefix) - 2.
  walkthrough: []
- title: Ports and protocols
  difficulty: beginner
  minutes: 15
  competency: networking-fundamentals
  body: 'TCP and UDP multiplex services using port numbers. Well-known ports: 22 SSH, 53 DNS, 80 HTTP,
    443 HTTPS, 445 SMB, 3389 RDP. TCP is connection-oriented (handshake, ordered, reliable); UDP is connectionless.
    Identifying which ports are open and what speaks on them is the start of any enumeration.'
  exercises:
  - kind: short_answer
    prompt: Default port for HTTPS?
    answer: '443'
    competency: networking-fundamentals
    explanation: HTTPS listens on TCP 443.
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Routing and the gateway
  difficulty: beginner
  minutes: 10
  competency: networking-fundamentals
  body: A host's routing table decides where packets go. The *default gateway* handles anything not on
    the local subnet. `ip route` shows the table; `ip addr` shows interfaces/addresses. In segmented networks,
    routing and firewall rules together decide which zones can reach each other.
  exercises:
  - kind: command
    prompt: Command to show the routing table (iproute2)?
    answer: ip route
    competency: networking-fundamentals
    explanation: '`ip route` prints routes.'
    points: 10
    hints: []
  hints: []
  walkthrough: []
- title: Map interfaces, routes, and services
  difficulty: intermediate
  minutes: 20
  competency: networking-fundamentals
  body: 'Start with local facts: `ip addr` shows interfaces and addresses, `ip route` shows where traffic
    goes, and `ss -lntup` shows local listeners. For an authorised remote target, scan only the agreed
    range and use service detection to identify what answers. Record address, port, transport, service
    name, and evidence separately; an open port is evidence of a listener, not proof of a vulnerability.


    Use the methods from **Networking Fundamentals** to work this checklist:


    - Understand ip addressing and subnets

    - Understand ports and protocols

    - Understand routing and the gateway


    For each item, record the target or evidence, the action you took, and the result. Mark anything not
    verified as an assumption. Stop if the action would cross the written scope.'
  exercises:
  - kind: mcq
    prompt: Which command shows the host's routing table on Linux?
    choices:
    - ip route
    - ip addr
    - ss -lntup
    - cat /etc/passwd
    answer: ip route
    competency: networking-fundamentals
    explanation: '`ip route` displays the local routing table and default gateway.'
    points: 10
    hints: []
  hints:
  - text: Use the lesson's commands and record a short evidence note for each observation.
  walkthrough: []
- title: Diagnose reachability in layers
  difficulty: intermediate
  minutes: 20
  competency: networking-fundamentals
  body: 'When a connection fails, check the path in order: address and subnet, local route and gateway,
    name resolution if a hostname is involved, filtering policy, and finally whether the service is listening.
    ICMP failure alone does not prove a host is down. Compare a permitted test with a deliberately blocked
    path so the expected segmentation policy is clear.


    ## Apply this to Networking Fundamentals


    IP addressing, ports, protocols and routing — how machines talk.


    Before submitting your work, check that your evidence supports each conclusion, that you have verified
    the relevant control or behaviour, and that your notes explain limitations. A strong result is repeatable
    by another learner using the same target and steps.'
  exercises:
  - kind: short_answer
    prompt: What must be confirmed before performing active work on a target?
    answer: written authorisation and scope
    competency: networking-fundamentals
    explanation: Confirm written authorisation and scope before active work.
    points: 10
    hints:
    - Check the permission and the exact target range.
  hints:
  - text: Repeat the same check after a change so you can compare before and after.
  walkthrough: []
assessment:
  title: Networking Fundamentals Assessment
  questions:
  - kind: short_answer
    prompt: Default SSH port?
    answer: '22'
    competency: networking-fundamentals
    explanation: SSH uses TCP 22.
    points: 10
    hints:
    - Find the well-known TCP port assigned to secure remote shell access.
  - kind: mcq
    prompt: Which is connectionless?
    choices:
    - TCP
    - UDP
    - ICMP handshake
    - TLS
    answer: UDP
    competency: networking-fundamentals
    explanation: UDP is connectionless.
    points: 10
    hints:
    - Which transport protocol sends datagrams without first establishing a connection or performing a
      handshake?
  - kind: short_answer
    prompt: Usable hosts in a /28?
    answer: '14'
    competency: networking-fundamentals
    explanation: 2^4 - 2 = 14.
    points: 10
    hints:
    - A /28 leaves four host bits. Count all addresses, then remove the network and broadcast addresses.
  difficulty: beginner
  passing_score: 70
  description: ''
